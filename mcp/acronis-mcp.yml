name: Acronis API MCP
server_name: acronis-mcp
title: Acronis API MCP
description: Provides Acronis Cyber Protect Cloud platform APIs as MCP tools — tenant and user provisioning, service
  and quota management, backup policy configuration, resource protection, agent management, and monitoring.
status: published
vendor: Acronis International GmbH
deployment:
  mode: local-stdio
  install: npx -y @acronis-platform/mcp
  package: https://www.npmjs.com/package/@acronis-platform/mcp
  auth: oauth
  verified: searched
  note: Acronis ships no vendor-hosted remote MCP endpoint. The package can also run its own HTTP transport (MCP_TRANSPORT=http,
    default path /mcp on 127.0.0.1:3000) but that is a server the OPERATOR hosts, not a URL Acronis serves, so mode
    stays local-stdio.
transports:
- stdio
- streamable-http (self-hosted)
authentication:
  model: OAuth 2.0 client credentials against the Acronis IDP
  token_url: ${API_BASE_URL}/api/2/idp/token
  env:
  - API_BASE_URL
  - OAUTH_CLIENT_ID
  - OAUTH_CLIENT_SECRET
  - OAUTH_SCOPES
  - OAUTH_TOKEN_URL
  note: In HTTP transport with client_credentials the server refuses to start without MCP_BEARER_TOKEN, because
    it holds a privileged upstream token shared across callers.
configuration:
  default_api_base_url: https://mc-beta-cloud.acronis.com
  dynamic_tools: MCP_DYNAMIC_TOOLS=true exposes _list_api_endpoints and _enable_api_endpoints instead of registering
    all tools up front (MCP_MAX_TOOLS_ENABLED default 25)
  filters:
  - MCP_TOOLS_INCLUDE
  - MCP_TOOLS_EXCLUDE
tool_count: 160
api_tool_count: 157
