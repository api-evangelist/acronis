  - name: create_a_protection_policy_draft
    method: POST
    path: /api/policy_management/v4/drafts
    description: Starts a draft for building a new protection policy (via `new`) or editing an existing one (via
      `edit`). Returns a `Draft` that serves as a mutable workspace; persist it with `PUT /drafts/{draft_id}/state`.
  - name: fetch_a_protection_policy_draft
    method: GET
    path: /api/policy_management/v4/drafts/{draft_id}
    description: Returns the current state of the draft — its composite policy, resource context, state, and any
      validation issues.
  - name: cancel_a_protection_policy_draft
    method: DELETE
    path: /api/policy_management/v4/drafts/{draft_id}
    description: Discards the draft and all uncommitted changes. No policy is created or modified.
  - name: commit_or_cancel_a_protection_policy_draft
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/state
    description: Finalizes the draft — `done` commits it (creating or updating the policy), `cancelled` discards
      it. Supports save-as-template/temporary and moving context to a newly created policy.
  - name: set_a_protection_policy_draft_s_name
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/name
    description: Sets the display name of the draft's root policy; clears the default-name hint once an explicit
      name is set.
  - name: set_a_draft_s_resource_context
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/context
    description: Replaces the resource selection the draft applies to. Because context can affect any policy in
      the composite, the full updated draft is returned.
  - name: enable_or_disable_policies_in_a_draft
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/enabled_policies
    description: Bulk-toggles the `enabled` flag of individual policies within the draft composite, by ID.
  - name: set_a_draft_s_disabled_applications_context
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/disabled_applications_context
    description: Lists applications (by ID) to disable on commit to resolve application conflicts, instead of blocking
      the commit.
  - name: add_or_update_a_policy_in_a_draft
    method: POST
    path: /api/policy_management/v4/drafts/{draft_id}/policies
    description: Adds or updates a policy within the draft composite. Because the change may affect linked (downstream)
      policies, the full updated draft is returned.
  - name: remove_a_policy_from_a_draft
    method: DELETE
    path: /api/policy_management/v4/drafts/{draft_id}/policies/{policy_id}
    description: Removes the specified policy from the draft composite; linked downstream policies may be affected,
      so the full draft is returned.
  - name: enable_or_disable_a_policy_in_a_draft
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/policies/{policy_id}/enabled
    description: Sets the `enabled` flag of a single policy within the draft composite.
  - name: set_a_draft_policy_s_name
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/policies/{policy_id}/name
    description: Changes the name of the specified policy within the draft composite.
  - name: set_a_draft_policy_s_type
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/policies/{policy_id}/type
    description: Changes the type of the specified policy within the draft composite; may re-link dependent policies,
      so the full draft is returned.
  - name: set_a_draft_policy_s_comment
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/policies/{policy_id}/comment
    description: Sets the free-text comment of the specified policy within the draft composite.
  - name: update_a_draft_policy_s_settings
    method: PUT
    path: /api/policy_management/v4/drafts/{draft_id}/policies/{policy_id}/settings
    description: Applies a partial patch to the policy's settings (replace/add semantics; array fields may use `ArrayPatch`).
  - name: apply_a_policy
    method: POST
    path: /api/policy_management/v4/applications
    description: Creates a policy application that applies a protection policy to the specified resource.
  - name: fetch_a_list_of_policy_applications
    method: GET
    path: /api/policy_management/v4/applications
    description: Fetches a list of policy applications depending on provided filtering parameters.
  - name: remove_policy_applications
    method: DELETE
    path: /api/policy_management/v4/applications
    description: Removes a protection policy application on specific context. For multiple applications case, any
      critical, error or warning issues will be reported per application in the `issues` field of the response with
      code `200`.
  - name: fetch_applications_issue_statistics
    method: GET
    path: /api/policy_management/v4/applications/issues/statistics
    description: Fetches statistics for each issue occurred with applications.
  - name: execute_a_protection_policy
    method: PUT
    path: /api/policy_management/v4/applications/run
    description: Executes a protection policy on all resources that are subject to this policy application.
  - name: fetch_application_statuses_by_policy
    method: GET
    path: /api/policy_management/v4/policy_statuses
    description: 'Fetches a list of applications grouped by provided policy. Policies constituting the

      same `CompositePolicy` are considered as single logical item for filtering, sorting and paging.

      '
  - name: fetch_a_list_of_all_resources
    method: GET
    path: /api/resource_management/v4/resources
    description: ''
  - name: delete_resources
    method: DELETE
    path: /api/resource_management/v4/resources
    description: ''
  - name: create_a_resource
    method: POST
    path: /api/resource_management/v4/resources
    description: ''
  - name: post_multiple_resources_in_one_request_from_a_single_agent
    method: POST
    path: /api/resource_management/v4/resources/batch
    description: ''
  - name: fetch_a_count_of_all_resources_that_match_filter_parameters
    method: GET
    path: /api/resource_management/v4/resources/count
    description: ''
  - name: fetch_a_resource_by_id
    method: GET
    path: /api/resource_management/v4/resources/{resource_internal_or_external_id}
    description: ''
  - name: fetch_a_list_of_resource_s_attributes
    method: GET
    path: /api/resource_management/v4/resources/{resource_internal_or_external_id}/attributes
    description: Fetches a list of resource's attributes from all namespaces.
  - name: fetch_the_protection_status_of_resources
    method: GET
    path: /api/resource_management/v4/resource_statuses
    description: ''
- api: Agent Management REST API 2
  items:
  - name: fetch_agents
    method: GET
    path: /api/agent_manager/v2/agents
    description: 'Fetches all registered agents seen from specified tenant.


      Result includes all agents registered in this tenant and in all its child tenants that don''t

      block parent access using visibility barrier.

      '
  - name: delete_agents
    method: DELETE
    path: /api/agent_manager/v2/agents
    description: Cancels registration of the agents with Platform and deletes their service accounts.
  - name: fetch_agent
    method: GET
    path: /api/agent_manager/v2/agents/{agent_id}
    description: Fetches the specific agent.
