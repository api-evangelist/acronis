note: >-
  Acronis publishes no versioned, per-language REST client SDK for the Cyber Platform API. What it does
  publish, first-party, is: an MCP server package that wraps 157 Cyber Platform operations as agent
  tools; a React/design-token UI component family; a set of Go service toolkits; and officially
  maintained Python / PowerShell / Bash example clients for the platform API. Registry currency is
  recorded as structured version/published fields. The three acronis-cyber-platform-*-examples
  repositories are source-only (no registry artifact) and have not been pushed since 2023 — that gap
  against an API whose specs were regenerated in 2026 is the abandonment signal worth recording.
