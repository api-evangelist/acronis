description: >-
  Acronis publishes a first-party front-end component system on npm under the @acronis-platform scope,
  built from the acronis/uikit repository. It is the design system the Acronis console is built from,
  released publicly under MIT so partners building CyberApps and embedded integrations can match the
  platform look. These are client-side UI building blocks — they are not API SDKs and they do not call
  the Cyber Platform API for you.
