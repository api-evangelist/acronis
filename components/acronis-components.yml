embedded_surfaces:
- name: CyberApp UI builder
  description: >-
    Acronis' vendor portal composes partner-facing screens declaratively from UI fields (Identity,
    Secret, Connection settings) that are then passed to the partner's callback handler as
    X-CyberApp-Auth / X-CyberApp-Extra headers. It is a hosted form builder rather than a JavaScript
    embed, so no loader library is distributed.
  docs: https://developer.acronis.com/doc/callback-handler/formats/requests.html
