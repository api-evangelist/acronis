note: 'Derived mechanically from schema property names: an *_id field is read as belongs_to and an *_ids array as has_many.
  Acronis publishes no object-reference page with id prefixes, so no prefix table is asserted. The Acronis API Playbook
  (skills/acronis-api-playbook.md) is the provider text that maps console vocabulary onto these fields.'
core_entities:
- name: tenant
  description: 'The unit of everything. kind is partner | customer | folder | unit; the hierarchy is a tree rooted at
    the root tenant. Carries two interchangeable ids: a UUID (Account Management) and a numeric string (resource, policy
    and agent APIs).'
  api: account-management-v2
- name: user
  description: An account inside a tenant. enabled = active/suspended; activated = password set. Every user owns a personal_tenant_id
    used to scope agent registration.
  api: account-management-v2
- name: client
  description: An OAuth 2.0 API client (machine credential). Not a tenant.
  api: account-management-v2
- name: application
  description: A service/product, identified by application_id, bound to a tenant to enable it.
  api: account-management-v2
- name: offering_item
  description: A licensable feature or quota unit on a tenant — count (devices/storage) or feature flag, with quota.value
    (soft) and quota.overage (hard).
  api: account-management-v2
- name: resource
  description: A registered device / machine / workload. user_defined_name is the display name; aggregate.status carries
    protection state.
  api: resource-policy-management-v4
- name: policy
  description: A protection policy. A protection plan is the composite policy.protection.total holding module sub-policies
    linked by parent_ids.
  api: resource-policy-management-v4
- name: agent
  description: An installed Acronis protection agent; online is the liveness flag.
  api: agents-v2
- name: task
  description: A long-running platform operation, polled after an async write.
  api: tasks-v2
- name: activity
  description: A sub-operation of a task, used to track EDR response actions and agent operations.
  api: account-management-v2
- name: alert
  description: An operational alert, typed by category.
  api: alerts-v1
- name: incident
  description: An EDR-detected threat event with state, verdict and mitigation_state as three independent axes.
  api: mdr-v1
- name: event
  description: An Event Manager event, typed with a CTI identifier and delivered from a topic by cursor.
  api: events-v1
- name: vault
  description: A storage backend (called Storages in the console) within a location.
  api: vaultman-v1
- name: cloud_server
  description: A Disaster Recovery recovery server that can be failed over and back.
  api: disaster-recovery-v2
