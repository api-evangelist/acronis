      - type: string
        format: ipv4
      - type: string
        format: ipv6
      - type: string
        format: hostname
      - type: string
        minLength: 0
      type: string
    items:
      description: Backup type.
      enum:
      - full
      - incremental
      - differential
      - unknown
      - cdp
      type: string
    item0_19:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
        storage_type:
          $ref: '#/components/schemas/storage_type'
        catalog_type:
          type: string
        catalog_uri:
          type: string
        encryption_type:
          enum:
          - CRYPT_NONE
          - CRYPT_AES128
          - CRYPT_AES192
          - CRYPT_AES256
          - CRYPT_GOST
          type: string
        encryption_uri:
          type: string
        encryption_key:
          type: string
        dedup_type:
          type: string
        dedup_uri:
          type: string
    vm_heartbeat_validation:
      description: Value of backup validation status.
      enum:
      - SUCCESS
      - FAILURE
      - CANCELLED
      type: string
    items_1:
      description: Reason why Backup was created.
      enum:
      - patch_management
      type: string
    item2:
      title: Amazon S3 Vault settings
      description: Amazon S3 Vault settings.
      type: object
      additionalProperties: false
      properties:
        connection_id:
          description: Connection ID is used to get Amazon credentials from Cloud Connection Service
          type: string
        region:
          description: Region of the storage
          type: string
        storage_class:
          description: Storage class
          enum:
          - STANDARD
          - STANDARD_IA
          - ONEZONE_IA
          - INTELLIGENT_TIERING
          type: string
        bucket:
          description: Bucket name
          type: string
        path:
          description: Path on the storage.
          type: string
        immutability_days:
          description: Object lock duration in days.
          default: 30
          type: integer
          minimum: 1
          maximum: 999
    id:
      description: Universally unique identifier.
      type: string
      format: uuid
    storage_type_8:
      description: Vault storage type.
      enum:
      - unknown
      - local_folder
      - network_share
      - ftp
      - sftp
      - cd
      - tape
      - storage_server
      - asz
      - removable_drive
      - online
      - nfs_share
      - esx
      - local_abgw
      - microsoft_azure
      - amazon_s3
      - s3_compatible
      type: string
    item1:
      description: Numeric identifier.
      type: string
      pattern: ^\d+$
    tapes_for_restore:
      type: array
      items:
        $ref: '#/components/schemas/archive_id'
    storage_type:
      description: Vault storage type.
      enum:
      - unknown
      - local_folder
      - network_share
      - ftp
      - sftp
      - cd
      - tape
      - storage_server
      - asz
      - removable_drive
      - online
      - nfs_share
      - esx
      - local_abgw
