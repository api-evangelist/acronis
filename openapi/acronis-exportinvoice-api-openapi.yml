openapi: 3.2.0
info:
  title: PSA Export Invoice API
  version: v1
servers:
- url: https://dev-cloud.acronis.com/api/advanced-automation/v1
  variables: {}
tags:
- name: ExportInvoice
paths:
  /ExportInvoice:
    post:
      operationId: ExportInvoices
      description: Exports Invoices based on IDs and format type and sets their `Exported` flag and sets or updates `ExportedDate`.
      parameters:
      - name: ids
        description: ID of the invoice.
        required: true
        in: query
        schema:
          description: ID of the invoice.
          type: array
          items:
            $ref: '#/components/schemas/Guid'
      - name: exportFormat
        description: Export format. 0 for XML; 1 for CSV.
        required: true
        in: query
        schema:
          description: Export format. 0 for XML; 1 for CSV.
          enum:
          - 0
          - 1
          type: integer
      responses:
        '200':
          description: ''
          content:
            text/csv:
              schema:
                description: The invoice in CSV format.
            application/xml:
              schema:
                description: The invoice in XML format.
      security:
      - oauth2: []
      tags:
      - ExportInvoice
      summary: Export invoices
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Export invoices
components:
  schemas:
    Guid:
      example: 00000000-0000-0000-0000-000000000000
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  securitySchemes:
    oauth2:
      type: oauth2
      description: A description of the security scheme.
      flows:
        clientCredentials:
          scopes:
            urn:acronis.com::advanced_automation::advanced_automation_client: ''
