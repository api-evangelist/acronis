openapi: 3.2.0
info:
  title: Account Management Accounts API
  version: '2'
servers:
- url: https://dev-cloud.acronis.com/api/2
  variables: {}
tags:
- name: Accounts
paths:
  /accounts/forgot_link:
    get:
      operationId: GetForgotLink
      description: 'Get forgot password link by login.

        *WARNING.* Endpoint is disabled.'
      x-optionalSecurity: true
      parameters:
      - name: login
        description: User login.
        required: true
        in: query
        schema:
          description: User login.
          example: mylogin@acronis.com
          type: string
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forgot_link'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - {}
      tags:
      - Accounts
      summary: Get forgot link
      x-summary-source: derived
components:
