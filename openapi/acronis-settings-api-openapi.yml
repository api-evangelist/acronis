      x-operation-id-original: Get server settings
    put:
      operationId: UpdateServerSettings
      description: Updates the server settings
      parameters:
      - name: tenant_id
        description: 'UUID of a tenant in which context to perform the request in


          If not specified the request is executed in the current user''s tenant context'
        required: false
        in: query
        schema:
          description: 'UUID of a tenant in which context to perform the request in


            If not specified the request is executed in the current user''s tenant context'
          example: b8ccbf27-4e92-41a9-8b66-d78108985321
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        content:
          application/json:
            schema:
              example:
                server_settings:
                  server_name: Acronis Files Protect
                  root_web_address: https://dev-cloud.acronis.com
                  default_locale: de
                  session_timeout_in_minutes: 120
                  notification_admin_enabled: true
                  notification_admin_email: administrator1@example.com;administrator2@example.com
                  notification_admin_frequency: 120
              type: object
              required:
              - server_settings
              properties:
                server_settings:
                  type: object
                  properties:
                    server_name:
                      description: Cosmetic server name used for the website's title and in admin notification email messages
                      type: string
                    root_web_address:
                      description: DNS name or IP address of the website
                      type: string
                    default_locale:
                      description: Language for new Audit Log messages
                      enum:
                      - cs
                      - de
                      - en
                      - es
                      - fr
                      - it
                      - ja
                      - ko
                      - pl
                      - ru
                      - zh_tw
                      - zh_cn
                      type: string
                    session_timeout_in_minutes:
                      description: Lifespan of the session, in minutes
                      type: integer
                      minimum: 1
                    notification_admin_enabled:
                      description: Whether to send email summary of errors to administrator(s)
                      type: boolean
                    notification_admin_email:
                      description: 'Email address(es) of administrators to receive summary of errors


                        Separate email addresses with comma `,` or semicolon `;`'
                      type: string
                    notification_admin_frequency:
                      description: Frequency of sending email summary of errors to administrator(s), in minutes
                      type: integer
                      minimum: 1
      responses:
        '204':
          description: Successfully updated the server settings
          content: {}
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrative permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Settings
      summary: Update server settings
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Update server settings
  /settings/audit_log:
    get:
      operationId: GetAuditLogSettings
