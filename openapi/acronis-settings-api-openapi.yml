                settings:
                  office_online_integration_enabled: true
                  office_online_wopi_url: https://office-online.com
                  office_online_type_of_use: viewing-editing
                  office_online_additional_services_enabled: true
                  office_online_allow_self_signed_certificates: false
                  web_preview_enabled: true
                  only_allow_not_converted: false
                  max_cache_size_mb: 10000
                  servlet_allow_self_signed_certificates: false
                  generation_max_concurrent_calls: 1
              type: object
              required:
              - settings
              properties:
                settings:
                  type: object
                  properties:
                    office_online_integration_enabled:
                      description: Whether to enable the Office Online integration
                      type: boolean
                    office_online_wopi_url:
                      description: URL to use for contacting Office Online
                      type: string
                    office_online_type_of_use:
                      description: The allowed type of usage for Office Online
                      enum:
                      - editing
                      - viewing-editing
                      type: string
                    office_online_additional_services_enabled:
                      description: 'Whether to enable additional services for Office Online


                        Microsoft services for Bing spelling, proofing and Smart Lookup'
                      type: boolean
                    office_online_allow_self_signed_certificates:
                      description: Whether to allow connections to Office Online using self-signed certificates
                      type: boolean
                    web_preview_enabled:
                      description: Whether to enable the built-in document previewer
                      type: boolean
                    only_allow_not_converted:
                      description: Whether to allow previewing only files that do not require conversion
                      type: boolean
                    max_cache_size_mb:
                      description: Maximum allowed storage use for cached preview files, in MB
                      type: integer
                      minimum: 251
                    servlet_allow_self_signed_certificates:
                      description: Whether to allow connections to the web preview service using self-signed certificates
                      type: boolean
                    generation_max_concurrent_calls:
                      description: Maximum allowed concurrent preview generation calls
                      type: integer
                      minimum: 1
      responses:
