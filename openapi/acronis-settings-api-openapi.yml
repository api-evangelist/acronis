openapi: 3.2.0
info:
  title: File Sync & Share Settings API
  version: v1
servers:
- url: https://dev-cloud.acronis.com/fc/api/v1
  variables: {}
tags:
- name: Settings
paths:
  /settings/purging_policies:
    get:
      operationId: GetPurgingPoliciesSettings
      description: Gets the purging policies settings
      parameters:
      - name: tenant_id
        description: 'UUID of a tenant in which context to perform the request in


          If not specified the request is executed in the current user''s tenant context'
        required: false
        in: query
        schema:
          description: 'UUID of a tenant in which context to perform the request in


            If not specified the request is executed in the current user''s tenant context'
          example: b8ccbf27-4e92-41a9-8b66-d78108985321
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Successfully retrieved the purging policies settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgingPoliciesSettings'
        '403':
          description: Administrative permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Settings
      summary: Get purging policies settings
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Get purging policies settings
    put:
      operationId: UpdatePurgingPoliciesSettings
      description: Updates purging policies settings
      parameters:
      - name: tenant_id
        description: 'UUID of a tenant in which context to perform the request in


          If not specified the request is executed in the current user''s tenant context'
        required: false
        in: query
        schema:
          description: 'UUID of a tenant in which context to perform the request in


            If not specified the request is executed in the current user''s tenant context'
          example: b8ccbf27-4e92-41a9-8b66-d78108985321
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        content:
          application/json:
            schema:
              example:
                purging_policies_settings:
                  purge_deleted_files_older_than_enabled: true
                  purge_deleted_files_older_than_n: 2
                  purge_deleted_files_older_than_units: weeks
                  purge_revisions_older_than_enabled: true
                  purge_revisions_older_than_n: 1
                  purge_revisions_older_than_units: months
                  keep_at_least_n_revisions_enabled: true
                  keep_at_least_n_revisions: 3
                  only_keep_n_revisions_enabled: true
                  only_keep_n_revisions: 10
                  allow_users_to_selectively_purge_revisions: true
              type: object
              required:
              - purging_policies_settings
              properties:
                purging_policies_settings:
                  type: object
                  properties:
                    purge_deleted_files_older_than_enabled:
                      description: Whether to purge deleted files
                      type: boolean
                    purge_deleted_files_older_than_n:
                      description: The number of time units for purging deleted files
                      type: integer
                      minimum: 1
                    purge_deleted_files_older_than_units:
                      description: The time unit for purging deleted files
                      enum:
                      - days
                      - weeks
                      - months
                      type: string
                    purge_revisions_older_than_enabled:
                      description: Whether to purge previous revisions
                      type: boolean
                    purge_revisions_older_than_n:
                      description: The number of time units for purging previous revisions
                      type: integer
                      minimum: 1
                    purge_revisions_older_than_units:
                      description: The time unit for purging previous revisions
                      enum:
                      - days
                      - weeks
                      - months
                      type: string
                    keep_at_least_n_revisions_enabled:
                      description: Whether to keep a number of revisions regardless of their age
                      type: boolean
                    keep_at_least_n_revisions:
                      description: The number of revisions to keep from purging
                      type: integer
                      minimum: 1
                    only_keep_n_revisions_enabled:
                      description: Whether to keep only a certain number of revisions
                      type: boolean
                    only_keep_n_revisions:
                      description: The number of revisions to keep
                      type: integer
                      minimum: 1
                    allow_users_to_selectively_purge_revisions:
                      description: Whether to allow users to selectively purge revisions
                      type: boolean
      responses:
        '204':
          description: Successfully updated the purging policies settings
          content: {}
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrative permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Settings
      summary: Update purging policies settings
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Update purging policies settings
  /settings/server:
