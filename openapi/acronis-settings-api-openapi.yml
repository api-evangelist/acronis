components:
  schemas:
    AuditLogSettings:
      example:
        purge_logs_older_than_enabled: true
        purge_logs_older_than_units: weeks
        purge_logs_older_than_n: 3
      type: object
      required:
      - purge_logs_older_than_enabled
      - purge_logs_older_than_units
      - purge_logs_older_than_n
      properties:
        purge_logs_older_than_enabled:
          type: boolean
        purge_logs_older_than_units:
          enum:
          - days
          - weeks
          - months
          type: string
        purge_logs_older_than_n:
          type: integer
    PurgingPoliciesSettings:
      example:
        purge_deleted_files_older_than_enabled: false
        purge_deleted_files_older_than_n: 2
        purge_deleted_files_older_than_units: months
        purge_revisions_older_than_enabled: false
        purge_revisions_older_than_n: 1
        purge_revisions_older_than_units: months
        keep_at_least_n_revisions_enabled: false
        keep_at_least_n_revisions: 5
        only_keep_n_revisions_enabled: false
        only_keep_n_revisions: 2
        allow_users_to_selectively_purge_revisions: false
      type: object
      required:
      - purge_deleted_files_older_than_enabled
      - purge_deleted_files_older_than_n
      - purge_deleted_files_older_than_units
      - purge_revisions_older_than_enabled
      - purge_revisions_older_than_n
      - purge_revisions_older_than_units
      - keep_at_least_n_revisions_enabled
      - keep_at_least_n_revisions
      - only_keep_n_revisions_enabled
      - only_keep_n_revisions
      - allow_users_to_selectively_purge_revisions
      properties:
        purge_deleted_files_older_than_enabled:
          type: boolean
        purge_deleted_files_older_than_n:
          type: integer
        purge_deleted_files_older_than_units:
          enum:
          - days
          - weeks
          - months
          type: string
        purge_revisions_older_than_enabled:
          type: boolean
        purge_revisions_older_than_n:
          type: integer
        purge_revisions_older_than_units:
          enum:
          - days
          - weeks
          - months
          type: string
        keep_at_least_n_revisions_enabled:
          type: boolean
        keep_at_least_n_revisions:
          type: integer
        only_keep_n_revisions_enabled:
          type: boolean
        only_keep_n_revisions:
          type: integer
        allow_users_to_selectively_purge_revisions:
          type: boolean
    SecuritySettings:
      example:
        allow_collaborators_to_invite: true
        node_share_link_enable: false
        node_share_link_allow_public_links: true
        node_share_link_allow_login_links: true
        node_share_link_single_use_only: false
        node_share_link_ttl_range_enable: true
        node_share_link_ttl_max: 365
        shared_folder_expiration_required: false
        shared_folder_expiration_max_days: 365
      type: object
      required:
      - allow_collaborators_to_invite
      - node_share_link_enable
