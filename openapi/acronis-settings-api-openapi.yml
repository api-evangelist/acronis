                  type: object
                  properties:
                    purge_logs_older_than_enabled:
                      description: Whether to purge old logs
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    purge_logs_older_than_units:
                      description: The time unit for purging old logs
                      enum:
                      - days
                      - weeks
                      - months
