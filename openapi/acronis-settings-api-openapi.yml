      requestBody:
        content:
          application/json:
            schema:
              example:
                security_settings:
                  allow_collaborators_to_invite: 'true'
                  node_share_link_enable: 'true'
                  node_share_link_allow_public_links: 'false'
                  node_share_link_allow_login_links: 'true'
                  node_share_link_single_use_only: 'false'
                  node_share_link_ttl_range_enable: 'true'
                  node_share_link_ttl_max: 30
                  shared_folder_expiration_required: 'true'
                  shared_folder_expiration_max_days: 30
              type: object
              required:
              - security_settings
              properties:
                security_settings:
                  type: object
                  properties:
                    allow_collaborators_to_invite:
                      description: Whether to allow collaborators to invite other users to shared folders
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    node_share_link_enable:
                      description: Whether to allow single file sharing
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    node_share_link_allow_public_links:
                      description: Whether to allow public file links
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    node_share_link_allow_login_links:
                      description: Whether to allow login-required file links
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    node_share_link_single_use_only:
                      description: Whether to allow only single-use file links
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    node_share_link_ttl_range_enable:
                      description: Whether to require file links to expire
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    node_share_link_ttl_max:
                      description: Maximum expiration time for file links, in days
                      type: integer
                      minimum: 1
                    shared_folder_expiration_required:
                      description: Whether to require shared folders to expire
                      enum:
                      - 'true'
                      - 'false'
                      type: string
                    shared_folder_expiration_max_days:
                      description: Maximum expiration time for shared folders, in days
                      type: integer
                      minimum: 1
      responses:
        '204':
          description: Successfully updated the security settings
          content: {}
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
