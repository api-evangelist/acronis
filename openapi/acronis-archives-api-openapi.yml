                            last_backup_size:
                              type: integer
                            last_backup_path:
                              type: string
                            backup_count:
                              type: integer
                        marked_for_deletion:
                          description: True if archive marked as deleted. False otherwise.
                          type: boolean
                        pds_status:
                          description: State of physical data shipment.
                          enum:
                          - archiveNotReady
                          - archiveInTransit
                          - archiveDelivered
                          type: string
                        search_index_size:
                          description: Size of search index.
                          type: integer
                        resource_path:
                          description: Path to the backed up resource in a format acceptable by Resource Manager.
                          type: string
                        last_seen_at:
                          description: Last time when the archive was seen.
                          type: string
                          format: date-time
                        cataloged_status:
                          description: State of archive is cataloged.
                          enum:
                          - notIndexed
                          - partiallyIndexed
                          - indexed
                          type: string
                        forensic:
                          description: True if the archive contains forensic data. False otherwise.
                          type: boolean
                        pre_patch_management:
                          description: Flag that specifies whether the archive contains at least one backup which was made before patch management. True if there's at least one backup that was made before patch management. False otherwise.
                          type: boolean
                        malware_found:
                          description: Malware assessment result of backups in the archive. Absent if no backups were scanned. True if at least one backup has malware. False otherwise.
                          type: boolean
                        logical_size:
                          description: Reflects logical size of archive.
                          type: integer
                        immutable_size:
                          description: Reflects immutable size of archive.
                          type: integer
                        deleted_immutable:
                          description: True if the archive is marked as deleted immutable. False otherwise.
                          type: boolean
                        orphanage:
                          title: Set archive orphanage status request
                          description: Archive orphanage status description.
                          type: object
                          required:
                          - status
                          properties:
                            status:
                              description: Value of archive orphanage status.
                              enum:
                              - NONE
                              - NO_POLICY
                              - NO_RESOURCE
                              type: string
      security:
      - oauth2:
        - vault_manager::system_admin
        - vault_manager::admin
        - vault_manager::read
        - protection::readonly
      tags:
      - Archives
      summary: Fetch archives
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Fetch archives
    delete:
      operationId: DeleteArchives
      description: Deletes archives containing selected resources.
      x-ExtJS: VaultManager.DeleteResourceArchives
      parameters:
      - name: resourceId
        description: ID of resource.
        required: true
        in: query
        schema:
          description: ID of resource.
          type: string
          format: uuid
      - name: changeTag
        description: Tag for run tasks.
        required: true
        in: query
        schema:
          description: Tag for run tasks.
          type: string
      - name: vaultId
        description: ID of vault.
        required: false
        in: query
        schema:
          description: ID of vault.
          type: string
          format: uuid
      - name: clusterId
        description: Limit affinity to this cluster.
        required: false
        in: query
        schema:
          description: Limit affinity to this cluster.
          type: string
          format: uuid
      - name: locationCredentialsId
        description: ID of credentials to access vault.
        required: false
        in: query
        schema:
          description: ID of credentials to access vault.
          type: string
      - name: targetAgentId
        description: ID of the agent to execute the task.
        required: false
        in: query
        schema:
          description: ID of the agent to execute the task.
          type: string
      responses:
        '200':
          description: List of task IDs created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    description: List of Tasks identifiers.
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request.
          content: {}
        '500':
          description: Internal error occurred.
          content: {}
      security:
      - oauth2:
        - vault_manager::system_admin
        - vault_manager::admin
      tags:
      - Archives
      summary: Delete archives
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Delete archives
  /archives/{archiveID}/backups:
    get:
      operationId: FetchArchiveBackups
      description: Fetches a list of backups within the archive.
      x-ExtJS: VaultManager.ListArchiveBackups
      parameters:
      - name: resourceId
        description: Show only backups for specified resources.
        required: false
        in: query
        schema:
          description: Show only backups for specified resources.
          type: array
          items:
            description: Universally unique identifier.
            type: string
            format: uuid
      - name: protectedByPassword
        description: 'Show only backups in protected by password or unprotected by password archives.


          If not specified, backups are listed regardless of their password protection status.

          '
        required: false
        in: query
        schema:
          description: 'Show only backups in protected by password or unprotected by password archives.


            If not specified, backups are listed regardless of their password protection status.

            '
          type: boolean
      - name: count
        description: Show total count in the response.
        in: query
        schema:
          description: Show total count in the response.
          default: false
          type: boolean
      - name: before
        description: 'Base64-encoded token obtained from the previous response.

          Points to the end of the page.

          '
        in: query
        schema:
          description: 'Base64-encoded token obtained from the previous response.

            Points to the end of the page.

            '
          type: string
      - name: tapeId
        description: Show only backups for specified tapes.
        required: false
        in: query
        schema:
          description: Show only backups for specified tapes.
          type: array
          items:
            description: Universally unique identifier.
            type: string
            format: uuid
      - name: embed
        description: 'An array of field names to include in the response.


          Each value represents the name of the extension field to be included in the base response.

          '
        required: false
        in: query
        schema:
          description: 'An array of field names to include in the response.


            Each value represents the name of the extension field to be included in the base response.

            '
          type: array
          items:
            enum:
            - archive
            - automated_test_failover_validation_status
            - validation_status
            - vault
            type: string
      - name: showDeleted
        description: 'A flag that specifies what should be added to the list of returned backups:


          * 1 - All deleted backups are added to the list of archives.

          * 2 - Only deleted backups marked as immutable are added to the list of backups.

