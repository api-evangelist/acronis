openapi: 3.2.0
info:
  title: Account Management .well Known API
  version: '2'
servers:
- url: https://dev-cloud.acronis.com/api/2
  variables: {}
tags:
- name: .well Known
paths:
  /.well-known/openid-configuration:
    get:
      operationId: FetchOpenIDConfiguration
      description: Fetches the information about the OpenID provider's configuration. For more details, see https://openid.net/specs/openid-connect-discovery-1_0.html.
      x-optionalSecurity: true
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openidConfiguration'
      security:
      - {}
      tags:
      - .well Known
      summary: Fetch open ID configuration
      x-summary-source: derived
components:
  schemas:
    openidConfiguration:
      example:
        value:
          issuer: http://0.0.0.0:30675
          authorization_endpoint: http://0.0.0.0:30675/idp/auth
          token_endpoint: http://0.0.0.0:30675/idp/token
          jwks_uri: http://0.0.0.0:30675/idp/keys
          response_types_supported:
          - code
          subject_types_supported:
          - public
          id_token_signing_alg_values_supported:
          - RS256
          scopes_supported: []
          token_endpoint_auth_methods_supported:
          - client_secret_basic
          revocation_endpoint: http://0.0.0.0:30675/idp/revoke_token
          revocation_endpoint_auth_methods_supported:
          - client_secret_basic
          - client_secret_post
          - none
          device_authorization_endpoint: http://0.0.0.0:30675/idp/device_authorization
      type: object
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - jwks_uri
      - response_types_supported
      - subject_types_supported
      - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        revocation_endpoint:
          type: string
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        device_authorization_endpoint:
          type: string
