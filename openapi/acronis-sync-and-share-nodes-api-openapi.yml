  /sync_and_share_nodes/{node_uuid}/revisions:
    get:
      operationId: Get file or folder revisions list
      description: Gets a list of all revisions of a file/folder
      parameters:
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Successfully retrieved the list of revisions
          content:
            application/json:
              schema:
                example:
                - node_uuid: 444f4f94-9f0e-4183-9d47-b1804e819f61
                  name: file.txt
                  file_modification_date: '2019-06-12T15:28:15Z'
                  revision: 2
                  size: 13499
                  is_latest: true
                  created_at: '2019-06-13T11:40:54Z'
                  is_deleted: false
                  available: false
                  purged: true
                  writable: true
                  revised_by:
                    name: user
                    email: user@example.com
                - node_uuid: 444f4f94-9f0e-4183-9d47-b1804e819f61
                  name: file.txt
                  file_modification_date: '2019-06-12T15:28:15Z'
                  revision: 1
                  size: 12435
                  is_latest: false
                  created_at: '2019-06-12T15:28:15Z'
                  is_deleted: false
                  available: false
                  purged: true
                  writable: true
                  revised_by:
                    name: user
                    email: user@example.com
                type: array
                items:
                  $ref: '#/components/schemas/NodeRevision'
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Get file or folder revisions list
      x-summary-source: derived
  /sync_and_share_nodes/{node_uuid}/revisions/{revision_number}:
    post:
      operationId: Restore file revision
      description: 'Restores specific revision of a file


        A new latest revision will be created that''s the same as the one to restore'
      parameters:
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: revision_number
        description: Number of the revision to which the file will be restored
        required: true
        in: path
        schema:
          description: Number of the revision to which the file will be restored
          example: 3
          type: integer
          minimum: 1
      responses:
        '204':
          description: Successfully reverted the file to its previous revision
          content: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Restore file revision
      x-summary-source: derived
  /sync_and_share_nodes/{node_uuid}/download:
    get:
      operationId: Get file or folder contents
      description: 'Downloads a file/folder


        Folders are downloaded as a ZIP archive'
      parameters:
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Successfully downloaded the file/folder
          headers:
            Content-Disposition:
              required: true
              schema:
                example: attachment; filename="test.txt"; filename*=utf-8''test.txt
                type: string
            Content-Transfer-Encoding:
              required: true
              schema:
                enum:
                - binary
                type: string
            Content-Type:
              required: true
              schema:
                enum:
                - application/octet-stream
                type: string
            Transfer-Encoding:
              required: true
              schema:
                enum:
                - chunked
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Get file or folder contents
      x-summary-source: derived
  /sync_and_share_nodes/{node_uuid}/upload:
    post:
      operationId: Upload file
      description: 'Uploads a file


        If a file with same name exists in the target folder a new revision will be created'
      parameters:
      - name: filename
        description: Name of the file
        required: true
        in: query
        schema:
          description: Name of the file
          type: string
          minLength: 1
      - name: size
        description: Size of the file, in bytes
        required: true
        in: query
        schema:
          description: Size of the file, in bytes
          type: integer
          format: int64
      - name: checksum
        description: 'MD5 digest of the file''s contents


          When present, this checksum will be used to verify the integrity of the uploaded data'
        required: false
        in: query
        schema:
          description: 'MD5 digest of the file''s contents


            When present, this checksum will be used to verify the integrity of the uploaded data'
          type: string
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: Content-Type
        required: true
        in: header
        schema:
          enum:
          - application/octet-stream
          type: string
      - name: Transfer-Encoding
        required: true
        in: header
        schema:
          enum:
          - chunked
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Successfully uploaded the file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileNode'
        '400':
          description: Failed to upload the file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Upload file
      x-summary-source: derived
  /sync_and_share_nodes/{node_uuid}/copy:
    post:
      operationId: Copy file or folder
