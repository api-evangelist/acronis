openapi: 3.2.0
info:
  title: File Sync & Share Sync And Share Nodes API
  version: v1
servers:
- url: https://dev-cloud.acronis.com/fc/api/v1
  variables: {}
tags:
- name: Sync And Share Nodes
paths:
  /sync_and_share_nodes:
    post:
      operationId: Create folder
      description: 'Creates a folder by name or path


        If a folder with the same name, but different letter case exists in the same location it will be renamed'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sync_and_share_node
              properties:
                sync_and_share_node:
                  type: object
                  properties:
                    name:
                      description: Name of the folder. Do not use together with the "path" paramater.
                      type: string
                      minLength: 1
                    parent_uuid:
                      description: 'UUID of the parent folder


                        Defaults to root folder ID (`"0"`) if not specified'
                      type: string
                      pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    path:
                      description: Full path of the folder. Do not use together with the "name" paramater.
                      type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: Successfully created the folder
                type: object
                required:
                - owner
                - parents
                - name
                - office_online_permissions
                - synced
                - parent_uuid
                - read_only
                - has_shared_child_nodes
                - is_shared
                - has_writable_children
                - actions
                - file_modification_date
                - path
                - permissions
                - uuid
                - is_directory
                - owner_email
                - is_deleted
                - checksum
                - has_active_links
                properties:
                  size:
                    description: Size of the node
                    type: integer
                    format: int64
                  owner:
                    description: Information about the owner of the node
                    type: object
                    required:
                    - uuid
                    - name
                    - email
                    properties:
                      uuid:
                        $ref: '#/components/schemas/UUID'
                      name:
                        type: string
                      email:
                        type: string
                  parents:
                    description: 'Parent nodes of the current node


                      The nodes are hierarchically ordered and include the current node'
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - uuid
                      - is_root
                      properties:
                        name:
                          type: string
                        uuid:
                          $ref: '#/components/schemas/NodeUUID'
                        is_root:
                          type: boolean
                  name:
                    description: Name of the node
                    type: string
                    minLength: 1
                  office_online_permissions:
                    description: Node permissions related to Office Online
                    type: object
                    required:
                    - can_create_files_into
                    - can_be_previewed
                    - can_be_edited
                    properties:
                      can_create_files_into:
                        type: boolean
                      can_be_previewed:
                        type: boolean
                      can_be_edited:
                        type: boolean
                  synced:
                    description: Sync status of the node
                    enum:
                    - not_synced
                    - sync_2_way
                    type: string
                  parent_uuid:
                    description: Unique identifier of the parent node
                    type: string
                    pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  read_only:
                    description: Whether the node is read-only
                    type: boolean
                  has_shared_child_nodes:
                    description: Whether any of the node's child nodes have been shared
                    type: boolean
                  is_shared:
                    description: Whether the node has been shared
                    type: boolean
                  preview_type:
                    type:
                    - string
                    - 'null'
                  has_writable_children:
                    description: Whether the node has writable child nodes
                    type: boolean
                  actions:
                    description: Relative URLs to actions that can be performed on the node
                    type: object
                    properties:
                      download:
                        description: Download URL
                        type: string
                      upload:
                        description: Upload URL
                        type: string
                      preview:
                        description: Preview URL
                        type: string
                  expiration_date:
                    description: Date when the shared access to the node will expire
                    type: string
                    format: date-time
                  file_modification_date:
                    description: Modification date of the node
                    type: string
                    format: date-time
                  path:
                    description: Path to the node
                    type: string
                  permissions:
                    description: Permissions for the current user related to the node
                    type: object
                    required:
                    - can_be_renamed
                    - can_be_unsubscribed
                    - can_be_restored
                    - can_create_folders_into
                    - can_be_copied
                    - can_create_files_into
                    - can_view_members
                    - can_be_synced_2_way
                    - can_be_deleted
                    - can_be_synced_1_way
                    - can_be_moved
                    - can_be_shared
                    - can_be_shared_via_link
                    - can_invite
                    - can_be_downloaded
                    - can_selectively_purge_revisions
                    properties:
                      can_be_renamed:
                        description: Whether the node can be renamed
                        type: boolean
                      can_be_unsubscribed:
                        description: 'Whether the node can be unsubscribed from


                          Users can unsubscribe from nodes shared to them'
                        type: boolean
                      can_be_restored:
                        description: Whether a deleted node can be restored
                        type: boolean
                      can_create_folders_into:
                        description: Whether new folders can be created in this node
                        type: boolean
                      can_be_copied:
                        description: Whether the node can be copied
                        type: boolean
                      can_create_files_into:
                        description: Whether new files can be created in this node
                        type: boolean
                      can_view_members:
                        description: Whether members of this node can be viewed
                        type: boolean
                      can_be_synced_2_way:
                        description: Whether the node can be 2-way synced
                        type: boolean
                      can_be_deleted:
                        description: Whether the node can be deleted
                        type: boolean
                      can_be_synced_1_way:
                        description: Whether the node can be 1-way synced
                        type: boolean
                      can_be_moved:
                        description: Whether the node can be moved
                        type: boolean
                      can_be_shared:
                        description: Whether the node node can be shared to other users
                        type: boolean
                      can_be_shared_via_link:
                        description: Whether the node can be shared via file link
                        type: boolean
                      can_invite:
                        description: Whether new members can be invited to this node
                        type: boolean
                      can_be_downloaded:
                        description: Whether the node can be downloaded
                        type: boolean
                      can_selectively_purge_revisions:
                        description: Whether revisions of this node can be permanently deleted
                        type: boolean
                  uuid:
                    description: Unique identifier of the node
                    type: string
                    pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  is_directory:
                    description: Whether the node is a directory or a file
                    type: boolean
                  owner_email:
                    description: Email of the node's owner
                    type: string
                  is_deleted:
                    description: Whether the node is deleted
                    type: boolean
                  checksum:
                    description: MD5 checksum of the node
                    type: string
                  has_active_links:
                    description: Whether the node has any active links
                    type: boolean
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Create folder
      x-summary-source: derived
  /sync_and_share_nodes/{node_uuid}:
    get:
      operationId: Get file or folder information
      description: Gets information about a file/folder
      parameters:
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Successfully retrieved the file/folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Get file or folder information
      x-summary-source: derived
    put:
      operationId: Update file or folder
      description: Updates a file/folder
      parameters:
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        content:
          application/json:
            schema:
              example:
                sync_and_share_node:
                  name: new_name.txt
              type: object
              required:
              - sync_and_share_node
              properties:
                sync_and_share_node:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      description: New name of the file/folder
                      type: string
                      minLength: 1
      responses:
        '204':
          description: Successfully updated the file/folder
          content: {}
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Update file or folder
      x-summary-source: derived
    delete:
      operationId: Delete file or folder
      description: Deletes a file/folder
      parameters:
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '204':
          description: Successfully deleted the file/folder
          content: {}
        '403':
          description: Node permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - oauth_2_0: []
      tags:
      - Sync And Share Nodes
      summary: Delete file or folder
      x-summary-source: derived
  /sync_and_share_nodes/{node_uuid}/contents:
    get:
      operationId: Get files and folders list
      description: Gets a list of files and folders within a folder
      parameters:
      - name: per_page
        description: The number of items to be retrieved
        required: false
        in: query
        schema:
          description: The number of items to be retrieved
          type: integer
      - name: page
        description: 'The page to return


          Starts from 1'
        required: false
        in: query
        schema:
          description: 'The page to return


            Starts from 1'
          type: integer
      - name: node_uuid
        description: Unique identifier of the node
        required: true
        in: path
        schema:
          description: Unique identifier of the node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Successfully retrieved the list of files and folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '206':
          description: Successfully retrieved part of the list
          headers:
            Content-Range:
              description: The range of returned items relative to the whole collection
              required: true
