components:
  schemas:
    ConflictErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - domain
          - code
          - message
          properties:
            domain:
              enum:
              - Files
              type: string
            code:
              type: integer
            message:
              type: string
            context:
              type: object
    Member:
      description: Member of a shared folder
      type: object
      required:
      - id
      - read_only
      - can_view_members
      - can_invite
      - email
      - name
      - permission_for
      - can_be_changed
      properties:
        id:
          description: Unique identifier of the member
          type: string
        read_only:
          description: Whether the member has read-only access
          type: boolean
        can_view_members:
          description: Whether the member can view other members
          type: boolean
        can_invite:
          description: Whether the member can invite other members
          type: boolean
        email:
          description: Email of the member
          type: string
        name:
          description: Name of the member
          type: string
        permission_for:
          description: Type of the member
          enum:
          - owner
          - permission
          - guest
          type: string
        can_be_changed:
          description: Indicators which permissions can be changed
          type: object
          required:
          - can_invite
          - can_view_members
          - read_only
          properties:
            can_invite:
              description: Whether the `can_invite` permission can be changed
              type: boolean
            can_view_members:
              description: Whether the `can_view_members` permission can be changed
              type: boolean
            read_only:
              description: Whether the `read_only` permission can be changed
              type: boolean
    FileLink:
      example:
        id: 252
        node_uuid: b8a80643-9d35-43dd-a7f6-c05aaf1d5606
        access_restriction: shared
        download_url: https://dev-cloud.acronis.com/fc/t/f4cvit1j
        sharing_user_uuid: 0254fc28-1676-4f22-b530-f4f3bd9e7e45
        ttl: 7
        single_use: false
        emails:
        - user1@example.com
        - user2@example.com
        download_count: 0
        token: 2e5193c4-4fb5-4c39-a4aa-11fce808d841
        created_at: '2019-06-24T13:21:12Z'
        updated_at: '2019-06-24T13:21:12Z'
      type: object
      required:
      - id
      - node_uuid
      - access_restriction
      - download_url
      - sharing_user_uuid
      - ttl
      - single_use
      - emails
      - download_count
      - token
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        node_uuid:
          $ref: '#/components/schemas/UUID'
        access_restriction:
          enum:
          - public
          - access
          - shared
          type: string
        download_url:
          type: string
        sharing_user_uuid:
          $ref: '#/components/schemas/UUID'
        ttl:
          type: integer
        single_use:
          type: boolean
        emails:
          type: array
          items:
            type: string
        download_count:
          type: integer
        expired_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        token:
          $ref: '#/components/schemas/UUID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FileNode:
      description: Single revision of a file
      type: object
      required:
      - owner
      - parents
      - name
      - office_online_permissions
      - synced
      - parent_uuid
      - read_only
      - has_shared_child_nodes
      - is_shared
      - has_writable_children
      - actions
      - file_modification_date
      - permissions
      - path
      - uuid
      - is_directory
      - owner_email
      - checksum
      - is_deleted
      - has_active_links
      properties:
        size:
          description: Size of the node
          type: integer
          format: int64
        owner:
          description: Information about the owner of the node
          type: object
          required:
          - uuid
          - name
          - email
          properties:
            uuid:
              $ref: '#/components/schemas/UUID'
            name:
              type: string
            email:
              type: string
        parents:
          description: 'Parent nodes of the current node


            The nodes are hierarchically ordered and include the current node'
          type: array
          items:
            type: object
            required:
            - name
            - uuid
            - is_root
            properties:
              name:
                type: string
              uuid:
                $ref: '#/components/schemas/NodeUUID'
              is_root:
                type: boolean
        name:
          description: Name of the node
          type: string
          minLength: 1
        office_online_permissions:
          description: Node permissions related to Office Online
          type: object
          required:
          - can_create_files_into
          - can_be_previewed
          - can_be_edited
          properties:
            can_create_files_into:
              type: boolean
            can_be_previewed:
              type: boolean
            can_be_edited:
              type: boolean
        synced:
          description: Sync status of the node
          enum:
          - not_synced
          - sync_2_way
          type: string
        parent_uuid:
          description: Unique identifier of the parent node
          type: string
          pattern: ^0$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        read_only:
          description: Whether the node is read-only
          type: boolean
        has_shared_child_nodes:
          description: Whether any of the node's child nodes have been shared
          type: boolean
        is_shared:
          description: Whether the node has been shared
          type: boolean
        preview_type:
          type:
          - string
          - 'null'
        has_writable_children:
          description: Whether the node has writable child nodes
          type: boolean
        actions:
          description: Relative URLs to actions that can be performed on the node
          type: object
          properties:
            download:
              description: Download URL
              type: string
            upload:
              description: Upload URL
              type: string
            preview:
              description: Preview URL
              type: string
        file_modification_date:
          description: Modification date of the node
