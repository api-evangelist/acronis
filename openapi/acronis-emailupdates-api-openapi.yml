openapi: 3.2.0
info:
  title: PSA Email Updates API
  version: v1
servers:
- url: https://dev-cloud.acronis.com/api/advanced-automation/v1
  variables: {}
tags:
- name: EmailUpdates
paths:
  /EmailUpdates:
    get:
      operationId: Fetch email attachment
      description: 'Covers attachments management for a ticket: upload, download, delete.'
      parameters:
      - name: id
        required: true
        in: query
        schema:
          $ref: '#/components/schemas/Guid'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - list
                properties:
                  list:
                    type: object
                    additionalProperties: false
                    required:
                    - Base64ImageString
                    - ContentId
                    - ContentType
                    - FileName
                    - Id
                    - Stream
                    properties:
                      Base64ImageString:
                        type: string
                        format: binary
                      ContentId:
                        description: ''
                        type: string
                      ContentType:
                        description: ''
                        type: string
                      FileName:
                        description: ''
                        type: string
                      Id:
                        description: ''
                        example: 00000000-0000-0000-0000-000000000000
                        type: string
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      Stream:
                        type: string
                        format: binary
      security:
      - oauth2: []
      tags:
      - EmailUpdates
      summary: Fetch email attachment
      x-summary-source: derived
