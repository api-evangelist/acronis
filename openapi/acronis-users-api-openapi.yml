        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Users
      summary: Fetch current user info
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/2
      variables: {}
  /users/{user_id}:
    delete:
      operationId: DeleteUser
      description: Deletes a user by ID.
      parameters:
      - name: version
        description: Growing number of object internal version.
        required: true
        in: query
        schema:
          description: Growing number of object internal version.
          example: 1559561146223
          type: integer
      - name: user_id
        description: User ID (UUID).
        required: true
        in: path
        schema:
          description: User ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      responses:
        '204':
          description: User was successfully deleted.
          content: {}
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_admin
      tags:
      - Users
      summary: Delete user
      x-summary-source: derived
    put:
      operationId: UpdateUser
      description: Updates a user by ID.
      parameters:
      - name: user_id
        description: User ID (UUID).
        required: true
        in: path
        schema:
          description: User ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userPut'
      responses:
        '200':
          description: User was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
