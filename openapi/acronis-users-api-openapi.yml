openapi: 3.2.0
info:
  title: Acronis Users API
  version: '1.0'
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: acronis-account-management-v2-openapi.json, acronis-files-v1-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev-cloud.acronis.com/api/2
  variables: {}
- url: https://dev-cloud.acronis.com/fc/api/v1
  variables: {}
tags:
- name: Users
paths:
  /users:
    get:
      operationId: FetchUsersBatch
      description: 'Fetches a batch of users.


        Available in cloud version only.'
      parameters:
      - name: uuids
        description: 'A filter by comma-separated list of users'' UUIDs. Maximum of 100 UUIDs.

          Is mutually exclusive with `subtree_root_tenant_id`, `external_ids` and `tenant_id`.

          '
        in: query
        schema:
          description: 'A filter by comma-separated list of users'' UUIDs. Maximum of 100 UUIDs.

            Is mutually exclusive with `subtree_root_tenant_id`, `external_ids` and `tenant_id`.

            '
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
          minLength: 36
      - name: origin_id
        description: A filter by specific origin ID
        in: query
        schema:
          description: A filter by specific origin ID
          example: pillr.mdr
          type: string
      - name: external_ids
        description: 'A filter by comma-separated list of users'' UUIDs in the external Identity Provider. Maximum of 100 UUIDs.

          Is mutually exclusive with `subtree_root_tenant_id` and `uuids`.

          '
        in: query
        schema:
          description: 'A filter by comma-separated list of users'' UUIDs in the external Identity Provider. Maximum of 100 UUIDs.

            Is mutually exclusive with `subtree_root_tenant_id` and `uuids`.

            '
          example: fae84e50-0eef-11e7-bc3f-d39de3f5fe32,fae84e50-0eef-11e7-bc3f-d39de3f5fe32
          type: string
      - name: tenant_id
        description: 'A filter by specific tenant ID. Required when searching the users by `external_id`. Not used otherwise.

          '
        in: query
        schema:
          description: 'A filter by specific tenant ID. Required when searching the users by `external_id`. Not used otherwise.

            '
          example: fae84e50-0eef-11e7-bc3f-d39de3f5fe32
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      - name: subtree_root_tenant_id
        description: A filter by tenants tree starting from the specified tenant ID. Is mutually exclusive with `uuids` and `tenant_id`.
        in: query
        schema:
          description: A filter by tenants tree starting from the specified tenant ID. Is mutually exclusive with `uuids` and `tenant_id`.
          example: 1e4d7438-0ebe-11e7-b131-c7b5bde6feed
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      - name: updated_since
        description: A filter by users that were updated after the specified RFC3339 timestamp in UTC time zone.
        in: query
        schema:
          description: A filter by users that were updated after the specified RFC3339 timestamp in UTC time zone.
          example: '2016-02-28T16:41:41.090Z'
          type: string
          format: date-time
      - name: limit
        description: Number of elements in current users page of the response.
        in: query
        schema:
          description: Number of elements in current users page of the response.
          default: 2000
          type: integer
          minimum: 1
      - name: after
        description: 'Cursor to fetch the next users page. The cursor encodes all the filtering and sorting arguments, thus client does not need to provide all them for the next page, only cursor should be provided. Client can get the cursor from `paging.cursors.after` field of the previous page response.

          '
        in: query
        schema:
          description: 'Cursor to fetch the next users page. The cursor encodes all the filtering and sorting arguments, thus client does not need to provide all them for the next page, only cursor should be provided. Client can get the cursor from `paging.cursors.after` field of the previous page response.

            '
          type: string
      - name: lod
        description: 'A predefined level of details for the user object to return.


          The following levels of details can be specified:

          -   `stamps` - includes `id`, `version`, `tenant_id`, `created_at`, `updated_at`, `deleted_at`, `access_policies`, `origin_id`, `origin_external_id`, `disable_after`.

          -   `basic` - includes all stamps fields plus `personal_tenant_id`, `login`, `enabled`, `session_mfa_status`, `delivery_channel`.

          -   `full` - includes all basic fields plus `contact`, `activated`, `language`, `business_types`, `notifications`, `idp_id`, `external_id`, `mfa_status`, `external_operation_status`.'
        in: query
        schema:
          description: 'A predefined level of details for the user object to return.


            The following levels of details can be specified:

            -   `stamps` - includes `id`, `version`, `tenant_id`, `created_at`, `updated_at`, `deleted_at`, `access_policies`, `origin_id`, `origin_external_id`, `disable_after`.

            -   `basic` - includes all stamps fields plus `personal_tenant_id`, `login`, `enabled`, `session_mfa_status`, `delivery_channel`.

            -   `full` - includes all basic fields plus `contact`, `activated`, `language`, `business_types`, `notifications`, `idp_id`, `external_id`, `mfa_status`, `external_operation_status`.'
          default: full
          enum:
          - stamps
          - basic
          - full
          type: string
      - name: with_access_policies
        description: If true, all users' access policies will be returned in the response.
        in: query
        schema:
          description: If true, all users' access policies will be returned in the response.
          type: boolean
      - name: allow_deleted
        description: If true, deleted users may be returned.
        in: query
        schema:
          description: If true, deleted users may be returned.
          type: boolean
      - name: inside_organization
        description: If true, only users that belong to the same organization will be returned. It requires 'subtree_root_tenant_id' to be specified.
        in: query
        schema:
          description: If true, only users that belong to the same organization will be returned. It requires 'subtree_root_tenant_id' to be specified.
          type: boolean
      - name: access_policies
        description: Users in access policies will be returned. It accepts a comma-separated list. It requires 'inside_organization' to be set.
        in: query
        schema:
          description: Users in access policies will be returned. It accepts a comma-separated list. It requires 'inside_organization' to be set.
          example: company_admin,unit_admin
          type: string
      - name: tenant_kinds
        description: Users in tenant kinds will be returned. It accepts a comma-separated list. It requires 'inside_organization' to be set.
        in: query
        schema:
          description: Users in tenant kinds will be returned. It accepts a comma-separated list. It requires 'inside_organization' to be set.
          example: customer,unit
          type: string
      - name: target_tenant_id
        description: Users within range starting from 'subtree_root_tenant_id' to the 'target_tenant_id' will be returned. It requires 'inside_organization' to be set.
        in: query
        schema:
          description: Users within range starting from 'subtree_root_tenant_id' to the 'target_tenant_id' will be returned. It requires 'inside_organization' to be set.
          example: fae84e50-0eef-11e7-bc3f-d39de3f5fe32
          type: string
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userBatch'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Users
      summary: Fetch users batch
      x-summary-source: derived
    post:
      operationId: CreateUser
      description: 'Creates a new user.

        If the user is created in a customer tenant and below - a personal tenant will be created and attached to it.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userPost'
      responses:
        '200':
          description: User was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '415':
          description: Requested type in the `Accept` request header is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_admin
      tags:
      - Users
      summary: Create user
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/2
      variables: {}
  /users/check_login:
    get:
      operationId: CheckLoginNameAvailability
      description: Checks whether the login name (username) is available or already taken.
      parameters:
      - name: username
        description: A login name to check.
        required: true
        in: query
        schema:
          description: A login name to check.
          type: string
      responses:
        '204':
          description: Login name is available.
          content: {}
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '406':
          description: Provided arguments are not acceptable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '409':
          description: Another object of the same type already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Users
      summary: Check login name availability
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/2
      variables: {}
  /users/check_password:
    post:
      operationId: CheckPassword
