openapi: 3.0.3
info:
  title: Acronis Account Management Activities Users API
  description: The Acronis Account Management API provides endpoints for managing tenants, users, OAuth clients, applications, licensing (offering items), usage reporting, infrastructure, and branding within the Acronis Cyber Protect Cloud platform.
  version: '2.0'
  contact:
    name: Acronis Developer Portal
    url: https://developer.acronis.com
  x-generated-from: documentation
  x-last-validated: '2026-04-19'
servers:
- url: https://{datacenter}.acronis.com/api/2
  description: Acronis Cloud API - Account Management
  variables:
    datacenter:
      default: eu2-cloud
      description: Acronis datacenter region (e.g., us-cloud, eu2-cloud, au-cloud)
security:
- bearerAuth: []
tags:
- name: Users
  description: User account management within tenants
paths:
  /tenants/{tenant_id}/users:
    get:
      operationId: listTenantUsers
      summary: Acronis List Tenant Users
      description: List all users belonging to a specific tenant.
      tags:
      - Users
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Tenant UUID
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
        description: Maximum number of results
      - name: after
        in: query
        schema:
          type: string
        description: Cursor for pagination
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Paging:
      type: object
      properties:
        cursors:
          type: object
          properties:
            after:
              type: string
              description: Cursor for next page
    User:
      type: object
      description: Acronis platform user account
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier
        login:
          type: string
          description: Username/login for the user
          example: jsmith
        email:
          type: string
          format: email
          description: User email address
          example: jsmith@example.com
        firstname:
          type: string
          example: John
        lastname:
          type: string
          example: Smith
        enabled:
          type: boolean
          description: Whether the user account is active
        tenant_id:
          type: string
          format: uuid
          description: Tenant the user belongs to
        created_at:
          type: string
          format: date-time
    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        paging:
          $ref: '#/components/schemas/Paging'
    Error:
      type: object
      description: API error response
      properties:
        code:
          type: integer
          description: Error code
          example: 400
        message:
          type: string
          description: Human-readable error message
          example: Invalid request parameters
        details:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 bearer token obtained from /idp/token
    basicAuth:
      type: http
      scheme: basic
      description: Base64-encoded client_id:client_secret
