      operationId: UpdateUserAccessPolicies
      description: Rewrites user's access policies.
      parameters:
      - name: user_id
        description: User ID (UUID).
        required: true
        in: path
        schema:
          description: User ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accessPoliciesList'
      responses:
