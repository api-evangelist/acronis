      summary: Update user
      x-summary-source: derived
    get:
      operationId: FetchUser
      description: Fetches a user by ID.
      parameters:
      - name: allow_deleted
        description: If true, deleted users may be returned.
        in: query
        schema:
          description: If true, deleted users may be returned.
          default: false
          type: boolean
      - name: user_id
        description: User ID (UUID).
        required: true
        in: path
        schema:
          description: User ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      responses:
