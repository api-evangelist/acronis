          description: Includes resources that are marked as deleted in the request result.
          default: false
          example: true
          type: boolean
      - name: uuid
        description: A unique identifier of the disaster recovery site.
        required: true
        in: path
        schema:
          description: A unique identifier of the disaster recovery site.
          example: 6782e594-781d-4ad2-b8ca-25a0c40f9938
          type: string
          pattern: ^[a-zA-Z0-9-]+$
      responses:
