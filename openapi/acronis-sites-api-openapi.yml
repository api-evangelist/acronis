                                          code:
                                            enum:
                                            - CloudConnectionWorkerIssue
                                            type: string
                                          context:
                                            type: object
                                            required:
                                            - connectionName
                                            properties:
                                              connectionName:
                                                type: string
                                              issueCodes:
                                                type: array
                                                items:
