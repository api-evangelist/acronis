openapi: 3.2.0
info:
  title: Account Management Tenants API
  version: '2'
servers:
- url: https://dev-cloud.acronis.com/api/2
  variables: {}
tags:
- name: Tenants
paths:
  /tenants:
    get:
      operationId: FetchTenantsBatch
      description: 'Available in cloud version only.


        Fetches details about multiple tenants specified by their UUIDs or about child tenants of a specific tenant specified by its UUID.'
      parameters:
      - name: uuids
        description: 'A filter by comma-separated list of tenants'' UUIDs. Maximum of 100 UUIDs.

          Is mutually exclusive with `subtree_root_id` and `parent_id`.

          '
        in: query
        schema:
          description: 'A filter by comma-separated list of tenants'' UUIDs. Maximum of 100 UUIDs.

            Is mutually exclusive with `subtree_root_id` and `parent_id`.

            '
          example: 1e4d7438-0ebe-11e7-b131-c7b5bde6feed,248c535a-0ebe-11e7-a80e-bbdaa1d60c7c
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
          minLength: 36
      - name: parent_id
        description: 'The UUID of a tenant which child tenants will be fetched.

          Is mutually exclusive with `subtree_root_id` and `uuids`.

          '
        in: query
        schema:
          description: 'The UUID of a tenant which child tenants will be fetched.

            Is mutually exclusive with `subtree_root_id` and `uuids`.

            '
          example: 370b7f6a-43ce-4028-ad69-ea47f7b04ee4
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      - name: subtree_root_id
        description: 'Filter to fetch tenants hierarchy starting from (including) the specified one. Sorting by tenant level is always assumed.

          Is mutually exclusive with `uuids` and `parent_id`.

          '
        in: query
        schema:
          description: 'Filter to fetch tenants hierarchy starting from (including) the specified one. Sorting by tenant level is always assumed.

            Is mutually exclusive with `uuids` and `parent_id`.

            '
          example: 1e4d7438-0ebe-11e7-b131-c7b5bde6feed
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      - name: updated_since
        description: A filter by tenants that were updated after the specified RFC3339 timestamp in UTC time zone.
        in: query
        schema:
          description: A filter by tenants that were updated after the specified RFC3339 timestamp in UTC time zone.
          example: '2016-02-28T16:41:41.090Z'
          type: string
          format: date-time
      - name: limit
        description: Number of elements to return in current offering items page of the response.
        in: query
        schema:
          description: Number of elements to return in current offering items page of the response.
          default: 5000
          type: integer
          minimum: 1
      - name: after
        description: 'Cursor to fetch the next tenants page. The cursor encodes all the filtering and sorting arguments, thus client does not need to provide all them for the next page, only cursor should be provided. Client can get the cursor from `paging.cursors.after` field of the previous page response.

          '
        in: query
        schema:
          description: 'Cursor to fetch the next tenants page. The cursor encodes all the filtering and sorting arguments, thus client does not need to provide all them for the next page, only cursor should be provided. Client can get the cursor from `paging.cursors.after` field of the previous page response.

            '
          type: string
      - name: lod
        description: 'A predefined level of details for the tenant object to return.


          The following levels of details can be specified:

          -   `stamps` - includes `id`, `parent_id`, `version`, `created_at`, `updated_at`, `deleted_at`, `contacts`, `offering_items`.

          -   `basic` - includes all stamps fields plus `name`, `kind`, `enabled`.

          -   `full` - includes all basic fields plus `customer_type`, `customer_id`, `brand_id`, `brand_uuid`, `brand_enabled`, `barrier`, `internal_tag`, `language`, `owner_id`, `has_children`, `default_idp_id`, `update_lock`, `ancestral_access`, `mfa_status`, `pricing_mode`, `contact`, `external_operation_status`, `production_start_date`.'
        in: query
        schema:
          description: 'A predefined level of details for the tenant object to return.


            The following levels of details can be specified:

            -   `stamps` - includes `id`, `parent_id`, `version`, `created_at`, `updated_at`, `deleted_at`, `contacts`, `offering_items`.

            -   `basic` - includes all stamps fields plus `name`, `kind`, `enabled`.

            -   `full` - includes all basic fields plus `customer_type`, `customer_id`, `brand_id`, `brand_uuid`, `brand_enabled`, `barrier`, `internal_tag`, `language`, `owner_id`, `has_children`, `default_idp_id`, `update_lock`, `ancestral_access`, `mfa_status`, `pricing_mode`, `contact`, `external_operation_status`, `production_start_date`.'
          default: full
          enum:
          - stamps
          - basic
          - full
          type: string
      - name: with_contacts
        description: If true, all tenants' referencing contacts will be returned in the response.
        in: query
        schema:
          description: If true, all tenants' referencing contacts will be returned in the response.
          type: boolean
      - name: with_offering_items
        description: If true, only tenants with count offering items will be returned in the response.
        in: query
        schema:
          description: If true, only tenants with count offering items will be returned in the response.
          type: boolean
      - name: with_infra_offering_items
        description: If true, only tenants with infra offering items will be returned in the response.
        in: query
        schema:
          description: If true, only tenants with infra offering items will be returned in the response.
          type: boolean
      - name: expand_offering_items
        description: If true, all tenants' offering items will be returned in the response.
        in: query
        schema:
          description: If true, all tenants' offering items will be returned in the response.
          type: boolean
      - name: include_relative_path
        description: 'If true, fetches the hierarchy of tenants starting from (and including) the trustee tenant up to the tenants with the specified UUIDs. Only tenants in the path between the trustee and the target tenants will be returned.

          Is mutually exclusive with `subtree_root_id` and `parent_id`.

          '
        in: query
        schema:
          description: 'If true, fetches the hierarchy of tenants starting from (and including) the trustee tenant up to the tenants with the specified UUIDs. Only tenants in the path between the trustee and the target tenants will be returned.

            Is mutually exclusive with `subtree_root_id` and `parent_id`.

            '
          type: boolean
      - name: allow_deleted
        description: If true, deleted tenants may be returned.
        in: query
        schema:
          description: If true, deleted tenants may be returned.
          type: boolean
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tenantBatch'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Tenants
      summary: Fetch tenants batch
      x-summary-source: derived
    post:
      operationId: CreateTenant
      description: Creates a new tenant.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tenantPost'
      responses:
        '201':
          description: Tenant was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tenant'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '415':
          description: Requested type in the `Accept` request header is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_admin
      tags:
      - Tenants
      summary: Create tenant
      x-summary-source: derived
  /tenants/applications:
    get:
      operationId: FetchTenantsApplicationsBatch
      description: Fetches a batch of applications' UUIDs for the provided list of tenants.
      parameters:
      - name: tenants
        description: A filter of applications by comma-separated list of tenants' UUIDs.
        required: true
        in: query
        schema:
          description: A filter of applications by comma-separated list of tenants' UUIDs.
          example: 1e4d7438-0ebe-11e7-b131-c7b5bde6feed,248c535a-0ebe-11e7-a80e-bbdaa1d60c7c
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
          minLength: 36
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchApplicationList'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '415':
          description: Requested type in the `Accept` request header is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Tenants
      summary: Fetch tenants applications batch
      x-summary-source: derived
  /tenants/offering_items:
    get:
      operationId: FetchTenantOfferingItemsBatch
      description: Fetches a batch of the offering items with their states and associated quotas.
      parameters:
      - name: subtree_root_tenant_id
        description: A filter by tenants tree starting from the specified tenant ID. Sorting by tenant level is always assumed.
        required: true
        in: query
        schema:
          description: A filter by tenants tree starting from the specified tenant ID. Sorting by tenant level is always assumed.
          example: 1e4d7438-0ebe-11e7-b131-c7b5bde6feed
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      - name: usage_names
        description: A filter of offering items by comma-separated list of usage names.
        in: query
        schema:
          description: A filter of offering items by comma-separated list of usage names.
          example: storage,local_storage
          type: string
      - name: editions
        description: A filter of offering items by comma-separated list of editions.
        in: query
        schema:
          description: A filter of offering items by comma-separated list of editions.
          example: standard,advanced,disaster_recovery
          type: string
      - name: offering_items
        description: A filter of offering items by comma-separated offering item names.
        in: query
        schema:
          description: A filter of offering items by comma-separated offering item names.
          example: vms,workstations
          type: string
      - name: updated_since
        description: A filter by offering items that were updated after the specified RFC3339 timestamp in UTC time zone.
        in: query
        schema:
          description: A filter by offering items that were updated after the specified RFC3339 timestamp in UTC time zone.
          example: '2016-02-28T16:41:41.090Z'
          type: string
          format: date-time
      - name: limit
        description: Number of elements to return in current offering items page of the response.
        in: query
        schema:
          description: Number of elements to return in current offering items page of the response.
          default: 5000
          type: integer
          minimum: 1
      - name: after
        description: 'Cursor to fetch the next offering items page. The cursor encodes all the filtering and sorting arguments, thus client does not need to provide all them for the next page, only cursor should be provided. Client can get the cursor from `paging.cursors.after` field of the previous page response.

          '
        in: query
        schema:
          description: 'Cursor to fetch the next offering items page. The cursor encodes all the filtering and sorting arguments, thus client does not need to provide all them for the next page, only cursor should be provided. Client can get the cursor from `paging.cursors.after` field of the previous page response.

            '
          type: string
      - name: allow_deleted
        description: If true, deleted offering items may be returned.
        in: query
        schema:
          description: If true, deleted offering items may be returned.
          type: boolean
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offeringItemList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Tenants
      summary: Fetch tenant offering items batch
      x-summary-source: derived
  /tenants/usages:
    get:
      operationId: FetchTenantsUsagesBatch
      description: Fetches a batch of usages of the tenant.
      parameters:
      - name: tenants
        description: A filter of usages by comma-separated list of tenants' UUIDs.
        required: true
        in: query
        schema:
          description: A filter of usages by comma-separated list of tenants' UUIDs.
          example: 1e4d7438-0ebe-11e7-b131-c7b5bde6feed,248c535a-0ebe-11e7-a80e-bbdaa1d60c7c
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
          minLength: 36
      - name: usage_names
        description: A filter of usages by comma-separated list of usage names.
        in: query
        schema:
          description: A filter of usages by comma-separated list of usage names.
          example: storage,local_storage
          type: string
      - name: editions
        description: A filter of usages by comma-separated list of editions.
        in: query
        schema:
          description: A filter of usages by comma-separated list of editions.
          example: standard,advanced,disaster_recovery
          type: string
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchUsageList'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '415':
          description: Requested type in the `Accept` request header is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Tenants
      summary: Fetch tenants usages batch
      x-summary-source: derived
    put:
      operationId: UpdateTenantsUsages
      description: 'Updates the values of the usages specified in `usage_type` or

        associated with the offering items specified in `offering_item`.


        Depending on the combination of provided fields, the usage may be

        reported either per tenant or per resource. See the descriptions of

        the fields for more details.


        Trustee is restricted either to be registered within root tenant kind or to have configured

        CyberApp (origin_id) with fully provisioned auth-consents through Application Manager

        Account server applications (not to be confused with CyberApps) are restricted

        to the enablement of offering items with nested usage types marked with the acc-app (origin_id)


        In case of failure the response body will contain a not-empty "error" field for each failed item.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/usagePut'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usagePutResult'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '415':
          description: Requested type in the `Accept` request header is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - oauth2:
        - urn:acronis.com::accounts::licensing_admin
        - urn:acronis.com::accounts::usage_reporter
      tags:
      - Tenants
      summary: Update tenants usages
      x-summary-source: derived
  /tenants/{tenant_id}:
    delete:
      operationId: DeleteTenant
      description: Deletes a tenant by ID.
      parameters:
      - name: version
        description: Growing number of object internal version.
        required: true
        in: query
        schema:
          description: Growing number of object internal version.
          example: 1559561146223
          type: integer
      - name: tenant_id
        description: Tenant ID (UUID).
        required: true
        in: path
        schema:
          description: Tenant ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      responses:
        '204':
          description: Tenant was successfully deleted.
          content: {}
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_admin
      tags:
      - Tenants
      summary: Delete tenant
      x-summary-source: derived
    put:
      operationId: UpdateTenant
      description: Updates a tenant by ID.
      parameters:
      - name: tenant_id
        description: Tenant ID (UUID).
        required: true
        in: path
        schema:
          description: Tenant ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tenantPut'
      responses:
        '200':
          description: Tenant was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tenant'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '409':
          description: Another object of the same type already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '415':
          description: Requested type in the `Accept` request header is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_admin
      tags:
      - Tenants
      summary: Update tenant
      x-summary-source: derived
    get:
      operationId: FetchTenant
      description: Fetches a tenant by ID.
      parameters:
      - name: embed_path
        description: If true, tenant path will be embedded in the result.
        in: query
        schema:
          description: If true, tenant path will be embedded in the result.
          type: boolean
      - name: allow_deleted
        description: If true, deleted tenant may be returned.
        in: query
        schema:
          description: If true, deleted tenant may be returned.
          type: boolean
      - name: tenant_id
        description: Tenant ID (UUID).
        required: true
        in: path
        schema:
          description: Tenant ID (UUID).
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tenant'
        '401':
          description: Method required an authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '403':
          description: Current user is not authorized to access this endpoint or its method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorScheme'
      security:
      - basicAuth: []
      - oauth2:
        - urn:acronis.com::account-server::tenant_viewer
      tags:
      - Tenants
      summary: Fetch tenant
      x-summary-source: derived
  /tenants/{tenant_id}/offering_items:
    get:
      operationId: FetchTenantOfferingItems
      description: Fetches a list offering items with state and associated quotas.
      parameters:
      - name: infra_uuid
        description: A filter by infrastructure UUID.
        in: query
        schema:
          description: A filter by infrastructure UUID.
          type: string
          pattern: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}'
          minLength: 36
          maxLength: 36
      - name: available_only
        description: 'If true, return only infrastructures and offering items available for the enablement according to internal business rules.

          '
        in: query
        schema:
          description: 'If true, return only infrastructures and offering items available for the enablement according to internal business rules.

            '
          example: true, false, 0, 1
          type: string
      - name: for_ui
        description: 'If true, the list of offering items will be returned in a form that is appropriate for the UI. Currently, offering items on a grace period will be filtered out.

          '
        in: query
        schema:
          description: 'If true, the list of offering items will be returned in a form that is appropriate for the UI. Currently, offering items on a grace period will be filtered out.

            '
          type: boolean
      - name: edition
        description: 'A filter of the offering items by edition.

          If "*" is provided, all editions will be returned.

          Offering items without an edition are not filtered out in any case.'
        in: query
        schema:
          description: 'A filter of the offering items by edition.

            If "*" is provided, all editions will be returned.

            Offering items without an edition are not filtered out in any case.'
          default: standard
          example: '*'
          type: string
      - name: usage_names
        description: A filter by comma-separated list of usage names.
        in: query
        schema:
          description: A filter by comma-separated list of usage names.
          example: storage,local_storage
          type: string
      - name: status
        description: 'A filter by offering item status.


          1 - active

          0 - not active'
        in: query
        schema:
          description: 'A filter by offering item status.


            1 - active

            0 - not active'
          enum:
          - 0
          - 1
          type: integer
      - name: include_secondary
        description: If true, secondary offering items will be included in the response.
        in: query
        schema:
          description: If true, secondary offering items will be included in the response.
          type: boolean
      - name: type
        description: A filter by offering item type.
        in: query
        schema:
          description: A filter by offering item type.
          enum:
          - count
          - feature
          - infra
          example: count
          type: string
