  version: '1.0'
  description: 'Operations tagged Hardware Nodes across 2 of this provider''s published API definitions: acronis-agents-v2-openapi.json, acronis-agent-management-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev-cloud.acronis.com/api/agent_manager/v2
  variables: {}
- url: https://{datacenter}.acronis.com/api/agent_manager/v2
  description: Acronis Agent Management API
  variables:
    datacenter:
      default: eu2-cloud
      description: Acronis datacenter region
tags:
- name: Hardware Nodes
paths:
  /hardware_nodes:
    get:
      operationId: FetchHardwareNodes
      description: 'Fetches all hardware nodes visible by the specified tenant.


        Result includes all nodes registered in this tenant and in all its child tenants that don''t

        block parent access using visibility barrier.'
      responses:
        '200':
          description: Hardware node list was successfully retrieved.
          content:
            application/json:
              schema:
                description: Hardware node list.
                type: object
                required:
                - items
                properties:
                  items:
                    description: Collection of hardware node descriptions.
                    type: array
                    items:
                      $ref: '#/components/schemas/HardwareNode'
        '401':
          description: User authorization failed. There are many reasons for the error.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - UNAUTHORIZED_REQUEST
                    - AUTHENTICATION_TIMEOUT
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - GENERAL
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '403':
          description: Access was denied for roles a user plays in Platform.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - ACCESS_DENIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '500':
          description: Service encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - MARSHALLING_ERROR
                    - DATABASE_ERROR
                    - BAD_RESPONSE
                    - COMMUNICATION_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
      security:
      - oauth_2_0_user:
        - urn:acronis.com::agent_manager::agent_viewer
        - urn:acronis.com::agent_manager::admin
      tags:
      - Hardware Nodes
      summary: Fetch hardware nodes
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/agent_manager/v2
      variables: {}
  /hardware_nodes/{node_id}:
    get:
      operationId: FetchHardwareNode
      description: Fetches the specific hardware node.
      parameters:
      - name: node_id
        description: The node ID.
        required: true
        in: path
        schema:
          description: The node ID.
          type: string
      responses:
        '200':
          description: Hardware node description was successfully retrieved.
          content:
            application/json:
              schema:
                description: Hardware node description.
                type: object
                required:
                - cpu
                - storage
                - ram
                - id
                - tenant_id
                properties:
                  cpu:
                    description: CPU description.
                    type: object
                    required:
                    - model
                    - slots
                    - cores
                    properties:
                      model:
                        description: CPU model name.
                        example: Intel Xeon E5-2620 V4 Broadwell-EP 2.0 GHz
                        type: string
                      slots:
                        description: Total number of CPU slots.
                        example: 2
                        type: integer
                        format: int32
                      cores:
                        description: Total number of CPU cores.
                        example: 16
                        type: integer
                        format: int32
                  agent_id:
                    description: The identifier of the agent managing the node.
                    type: string
                  model:
                    description: Hardware model name.
                    example: BDR-R1008
                    type: string
                  storage:
                    description: Storage description.
                    type: array
                    items:
                      $ref: '#/components/schemas/HardwareNodeStorage'
                  ram:
                    description: RAM description.
                    type: object
                    required:
                    - capacity
                    properties:
                      model:
                        description: 'Model of RAM module.


                          The model is not specified if several modules of different models are

                          installed.

                          '
                        example: Samsung M393A4K40BB1-CRC
                        type: string
                      capacity:
                        description: Total physical RAM capacity in bytes.
                        example: 137438953472
                        type: integer
                        format: int64
                  hardware_id:
                    description: Hardware unique identifier.
                    type: string
                  id:
                    description: Hardware node internal ID.
                    type: string
                  tenant_id:
                    description: Tenant ID of the node owner.
                    type: string
                  serial_number:
                    description: Hardware serial number.
                    type: string
        '401':
          description: User authorization failed. There are many reasons for the error.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - UNAUTHORIZED_REQUEST
                    - AUTHENTICATION_TIMEOUT
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - GENERAL
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '403':
          description: Access was denied for roles a user plays in Platform.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - ACCESS_DENIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '404':
          description: The requested entity cannot be found.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - AGENT_NOT_FOUND
                    - AGENT_UNIT_NOT_FOUND
                    - TENANT_NOT_FOUND
                    - HARDWARE_NODE_NOT_FOUND
                    - NOT_FOUND
                    - UNATTENDED_AGENT_UPDATE_SETTINGS_NOT_FOUND
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '500':
          description: Service encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
