      security:
      - oauth_2_0_user:
        - urn:acronis.com::agent_manager::agent_viewer
        - urn:acronis.com::agent_manager::admin
      tags:
      - Hardware Nodes
      summary: Fetch hardware node
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/agent_manager/v2
      variables: {}
components:
  schemas:
    HardwareNodeStorage:
      description: Hardware node storage device description.
      type: object
      required:
      - type
      - capacity
      properties:
        type:
          description: Type of the device.
          example: SSD
          type: string
        capacity:
          description: Total physical capacity of the device in bytes.
          type: integer
          format: int64
    HardwareNode:
      description: Hardware node descriptor.
      example:
        id: 8f27a66f-71ff-4b5c-b665-75ec0f42b849
        cpu:
          model: Intel Xeon E5-2620 V4 Broadwell-EP 2.0 GHz
          slots: 4
          cores: 32
        ram:
          capacity: 68719476736
        storage:
        - type: SSD
          capacity: 687194767360
        tenant_id: '37'
      type: object
      required:
      - id
      - cpu
      - ram
      - storage
      - tenant_id
      properties:
        id:
          description: Hardware node internal ID.
          type: string
        agent_id:
          description: The identifier of the agent managing the node.
          type: string
        model:
          description: Hardware model name.
          example: BDR-R1008
          type: string
        hardware_id:
          description: Hardware unique identifier.
          type: string
        serial_number:
          description: Hardware serial number.
          type: string
        cpu:
          description: CPU description.
          type: object
          required:
          - model
          - slots
          - cores
          properties:
            model:
              description: CPU model name.
              example: Intel Xeon E5-2620 V4 Broadwell-EP 2.0 GHz
              type: string
            slots:
              description: Total number of CPU slots.
              example: 2
              type: integer
              format: int32
            cores:
              description: Total number of CPU cores.
              example: 16
              type: integer
              format: int32
        ram:
          description: RAM description.
          type: object
          required:
          - capacity
          properties:
            model:
              description: 'Model of RAM module.


                The model is not specified if several modules of different models are

                installed.

                '
              example: Samsung M393A4K40BB1-CRC
              type: string
            capacity:
              description: Total physical RAM capacity in bytes.
              example: 137438953472
              type: integer
              format: int64
        storage:
          description: Storage description.
          type: array
          items:
            $ref: '#/components/schemas/HardwareNodeStorage'
        tenant_id:
          description: Tenant ID of the node owner.
          type: string
    HardwareNodeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HardwareNode_2'
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    HardwareNode_2:
      type: object
      description: Physical or virtual hardware node managed by Acronis
      properties:
        id:
          type: string
          description: Hardware node identifier
        hostname:
          type: string
          description: Node hostname
        type:
          type: string
          description: Node type
        status:
          type: string
          description: Node operational status
        tenant_id:
          type: string
          format: uuid
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth_2_0_user:
      type: oauth2
      description: OAuth 2.0 security scheme definition for a user authorization.
      flows:
        password:
          scopes:
            urn:acronis.com::agent_manager::admin: ''
            urn:acronis.com::agent_manager::agent_registrar: ''
            urn:acronis.com::agent_manager::agent_unregistrar: ''
            urn:acronis.com::agent_manager::agent_update_reference_viewer: ''
            urn:acronis.com::agent_manager::agent_update_settings_modifier: ''
            urn:acronis.com::agent_manager::agent_update_settings_viewer: ''
            urn:acronis.com::agent_manager::agent_viewer: ''
          tokenUrl: /api/2/idp/token
        clientCredentials:
          scopes:
            urn:acronis.com::agent_manager::admin: ''
            urn:acronis.com::agent_manager::agent_registrar: ''
            urn:acronis.com::agent_manager::agent_unregistrar: ''
            urn:acronis.com::agent_manager::agent_update_reference_viewer: ''
            urn:acronis.com::agent_manager::agent_update_settings_modifier: ''
            urn:acronis.com::agent_manager::agent_update_settings_viewer: ''
            urn:acronis.com::agent_manager::agent_viewer: ''
          tokenUrl: /api/2/idp/token
        authorizationCode:
          scopes:
            urn:acronis.com::agent_manager::admin: ''
            urn:acronis.com::agent_manager::agent_registrar: ''
            urn:acronis.com::agent_manager::agent_unregistrar: ''
            urn:acronis.com::agent_manager::agent_update_reference_viewer: ''
            urn:acronis.com::agent_manager::agent_update_settings_modifier: ''
            urn:acronis.com::agent_manager::agent_update_settings_viewer: ''
            urn:acronis.com::agent_manager::agent_viewer: ''
          authorizationUrl: /api/2/idp/authorize
          tokenUrl: /api/2/idp/token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
