      - name: policyName
        description: 'A policy name filter. Multiple entries are accepted.


          The ''like'' operator can be used to find a policy name by a sequence of characters. Usage: `like(value)` where "value" is a sequence of characters.

          '
        in: query
        schema:
          description: 'A policy name filter. Multiple entries are accepted.


            The ''like'' operator can be used to find a policy name by a sequence of characters. Usage: `like(value)` where "value" is a sequence of characters.

            '
          type: string
      - name: policyType
        description: A policy type filter. Multiple entries are accepted.
        in: query
        schema:
