        schema:
          description: A number of activities to return in one page. This parameter restricts usage of the query string parameters to `after`.
          type: integer
      - name: after
        description: The page token with the next page of the results. Can be used only with the `limit` query string parameter.
        in: query
        schema:
          description: The page token with the next page of the results. Can be used only with the `limit` query string parameter.
          type: string
      - name: order
        description: 'An ordering filter (position-dependent).


          Available ordering operators are:

          - `asc(field)` - ascending order

          - `desc(field)` - descending order


          Where "field" is one of the following values:  `id`, `uuid`, `type`, `startedByUser`,

          `state`, `createdAt`, `startedAt`, `updatedAt`, `completedAt`.

          '
        in: query
        schema:
          description: 'An ordering filter (position-dependent).


            Available ordering operators are:

            - `asc(field)` - ascending order

            - `desc(field)` - descending order


            Where "field" is one of the following values:  `id`, `uuid`, `type`, `startedByUser`,

            `state`, `createdAt`, `startedAt`, `updatedAt`, `completedAt`.

            '
          type: string
      - name: id
        description: An ID filter. Multiple entries are accepted.
        in: query
        schema:
          description: An ID filter. Multiple entries are accepted.
          type: integer
      - name: uuid
        description: A UUID filter. Multiple entries are accepted.
        in: query
        schema:
          description: A UUID filter. Multiple entries are accepted.
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: type
        description: A type filter. Multiple entries are accepted.
        in: query
        schema:
          description: A type filter. Multiple entries are accepted.
          type: string
      - name: startedBy
        description: 'A filter by a user who started the activity. Multiple entries are accepted.


          The ''like'' operator can be used to find a policy name by a sequence of characters. Usage: `like(value)` where "value" is a sequence of characters.

          '
        in: query
        schema:
          description: 'A filter by a user who started the activity. Multiple entries are accepted.


            The ''like'' operator can be used to find a policy name by a sequence of characters. Usage: `like(value)` where "value" is a sequence of characters.

            '
          type: string
      - name: policyId
        description: A policy ID filter. Multiple entries are accepted.
        in: query
        schema:
          description: A policy ID filter. Multiple entries are accepted.
