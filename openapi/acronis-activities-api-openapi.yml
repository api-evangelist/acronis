  /activities/{activity-id}:
    get:
      operationId: FetchAnActivity
      description: Fetches an activity by provided activity ID.
      x-AllowedTo:
      - task_manager::admin
      - task_manager::viewer
      parameters:
      - name: lod
        in: query
        schema:
          $ref: '#/components/schemas/levelOfDetailSingleEntity'
      - name: allow_deleted
        description: If true, allows to work with deleted entities.
        required: false
        in: query
        schema:
          description: If true, allows to work with deleted entities.
          example: true
          type: boolean
      - name: activity-id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_2'
        '400':
          description: Bad user input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainError'
        '404':
          description: The activity does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainError'
      security:
      - oauth2:
        - urn:acronis.com::task_manager::admin
        - urn:acronis.com::task_manager::viewer
      tags:
      - Activities
      summary: Fetch an activity
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Fetch an activity
    servers:
    - url: https://dev-cloud.acronis.com/api/task_manager/v2
      variables: {}
  /activities/{activity_id}:
    get:
      operationId: getActivity
      summary: Acronis Get Activity
      description: Retrieve details about a specific task activity by ID.
      tags:
      - Activities
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
        description: Activity unique identifier
      responses:
        '200':
          description: Activity details
          content:
            application/json:
              schema:
