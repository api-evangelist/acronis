openapi: 3.2.0
info:
  title: Acronis Account Management Activities API
  description: The Acronis Account Management API provides endpoints for managing tenants, users, OAuth clients, applications, licensing (offering items), usage reporting, infrastructure, and branding within the Acronis Cyber Protect Cloud platform.
  version: '2.0'
  contact:
    name: Acronis Developer Portal
    url: https://developer.acronis.com
  x-generated-from: documentation
  x-last-validated: '2026-04-19'
servers:
- url: https://{datacenter}.acronis.com/api/2
  description: Acronis Cloud API - Account Management
  variables:
    datacenter:
      default: eu2-cloud
      description: Acronis datacenter region (e.g., us-cloud, eu2-cloud, au-cloud)
security:
- bearerAuth: []
tags:
- name: Activities
  description: Task activity and sub-operation tracking
paths:
  /activities:
    get:
      operationId: listActivities
      summary: Acronis List Activities
      description: Fetch a list of task activities with filtering and pagination.
      tags:
      - Activities
      parameters:
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
        description: Filter activities by tenant UUID
      - name: task_id
        in: query
        schema:
          type: string
        description: Filter activities by parent task ID
      - name: state
        in: query
        schema:
          type: string
          enum:
          - enqueued
          - assigned
          - started
          - paused
          - completed
        description: Filter by activity state
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
        description: Maximum activities to return
      - name: after
        in: query
        schema:
          type: string
        description: Pagination cursor
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /activities/{activity_id}:
    get:
      operationId: getActivity
      summary: Acronis Get Activity
      description: Retrieve details about a specific task activity by ID.
      tags:
      - Activities
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
        description: Activity unique identifier
      responses:
        '200':
          description: Activity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ActivityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        paging:
          type: object
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    Activity:
      type: object
      description: A subordinate activity within a task
      properties:
        id:
          type: string
          description: Activity unique identifier
        type:
          type: string
          description: Activity type
        state:
          type: string
          enum:
          - enqueued
          - assigned
          - started
          - paused
          - completed
        result_code:
          type: string
          enum:
          - ok
          - error
          - warning
          - cancelled
          - abandoned
          - timedout
        parent_activity_id:
          type: string
          description: Parent activity UUID if nested
        task_id:
          type: string
          description: Parent task identifier
        sustainable:
          type: boolean
          description: Whether activity can be requeued on failure
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 bearer token obtained from /idp/token
    basicAuth:
      type: http
      scheme: basic
      description: Base64-encoded client_id:client_secret
