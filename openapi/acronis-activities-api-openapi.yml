          description: A code filter. Multiple entries are accepted.
          enum:
          - ok
          - error
          - warning
          - cancelled
          - abandoned
          - timedout
          type: string
      - name: createdAt
        description: A time filter. Single entry is accepted.
        in: query
        schema:
          description: A time filter. Single entry is accepted.
