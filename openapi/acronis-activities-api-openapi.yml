        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://{datacenter}.acronis.com/api/task_manager/v2
      description: Acronis Task Manager API
      variables:
        datacenter:
          default: eu2-cloud
          description: Acronis datacenter region
