          description: Error type or category. Can be ['Licensing','Access'] or name of service (for example 'PolicyManager' or 'VaultManager')
          type: string
        code:
          description: Error id or code, unique in the domain. Same as in 'reason' field
          type: string
        reason:
          description: Obsolete. Error id or code, unique in the domain. Same as in 'code' field
          type: string
        context:
          description: Error context dictionary
          type: object
        kbLink:
          $ref: '#/components/schemas/kbLinkInfo'
        debug:
          $ref: '#/components/schemas/debugInfo'
    actor:
      description: An actor identity.
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/string64'
        clusterId:
          $ref: '#/components/schemas/string64'
    kbLinkInfo:
      description: Components for kblink
      type: object
      required:
      - lineTag
      - serCode
      - version
      - build
      - product
      - os
      properties:
        lineTag:
          type: string
        serCode:
          type: string
        version:
          type: string
        build:
          type: integer
        product:
          type: string
        os:
          type: string
    levelOfDetail:
      enum:
      - tiny
      - short
      - long
      - full
      - debug
      - count
      type: string
    resultCode:
      enum:
      - ok
      - error
      - warning
      - cancelled
      - abandoned
      - timedout
      type: string
    tenant:
      description: A tenant identity.
      type: object
      required:
      - id
      - uuid
      properties:
        id:
          $ref: '#/components/schemas/string64'
        uuid:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        locator:
          description: A hierarchical tenant identifier in the following format - `/root-id/unit-id/sub-unit-id/tenant-id/`.
          type: string
    string256:
      description: A string that may contain up to 256 characters.
      type: string
    debugInfo:
      description: Error debug information (map type)
      type: object
    executionBottleneck:
      description: An execution bottleneck. The sum of all field values must equal 100.
      type: object
      properties:
        source:
          description: Bottleneck score when reading data.
          type: integer
          minimum: 0
          maximum: 100
        destination:
          description: Bottleneck score when writing data.
          type: integer
          minimum: 0
          maximum: 100
        processing:
          description: Bottleneck score during data processing on executor side.
          type: integer
          minimum: 0
          maximum: 100
    duration:
      description: Duration in the human-readable format like "1m", "10s", "1h25m43s" where "m" = "minutes", "s" = "seconds", "h" = "hours".
      type: string
    time:
      description: Time in RFC3339 format.
      type: string
    activity:
      description: The activity object.
      type: object
      required:
      - state
      - taskId
      - tenant
      - id
      - createdAt
      - updatedAt
      - executor
      - type
      properties:
        parentActivityId:
          description: The ID of the parent activity.
          type: integer
        state:
          $ref: '#/components/schemas/executionState'
        taskId:
          description: The ID of the task that is related to the activity.
          type: integer
        context:
          description: Activity context.
        result:
          $ref: '#/components/schemas/executionResult'
        tenant:
          $ref: '#/components/schemas/tenant'
        startedAt:
          $ref: '#/components/schemas/time'
        id:
