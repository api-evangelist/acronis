openapi: 3.2.0
info:
  title: Agents Agent Update Settings API
  version: '2'
servers:
- url: https://dev-cloud.acronis.com/api/agent_manager/v2
  variables: {}
tags:
- name: Agent Update Settings
paths:
  /agent_update_settings:
    put:
      operationId: UploadAgentUpdateSettings
      description: 'Stores new or updates existing agent-specific or/and master agent update settings. The agent must be

        registered to have its specific settings stored.


        Each settings object is considered to be agent-specific if it has agent ID field. Otherwise, it is treated

        as master settings. The collection must contain single item for each agent or/and tenant.'
      requestBody:
        content:
          application/json:
            schema:
              description: The collection of settings to store.
              type: object
              required:
              - items
              properties:
                items:
                  description: Collection of unattended agent update settings to be stored by Agent Manager.
                  type: array
                  items:
                    $ref: '#/components/schemas/AgentUpdateSettingsIn'
      responses:
        '204':
          description: Unattended agent update settings were successfully stored.
          content: {}
        '400':
          description: Request is malformed.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - BAD_REQUEST
                    - BAD_UNATTENDED_AGENT_UPDATE_SETTINGS
                    - UNMARSHALLING_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '401':
          description: User authorization failed. There are many reasons for the error.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - UNAUTHORIZED_REQUEST
                    - AUTHENTICATION_TIMEOUT
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - GENERAL
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '403':
          description: Access was denied for roles a user plays in Platform.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - ACCESS_DENIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '500':
          description: Service encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - MARSHALLING_ERROR
                    - DATABASE_ERROR
                    - BAD_RESPONSE
                    - COMMUNICATION_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
      security:
      - oauth_2_0_user:
        - urn:acronis.com::agent_manager::agent_update_settings_modifier
