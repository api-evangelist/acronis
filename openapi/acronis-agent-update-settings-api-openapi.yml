  /agent_update_settings/{id}:
    get:
      operationId: FetchAgentUpdateSettings
      description: 'Fetches agent-specific or master unattended agent update settings.


        If agent-specific settings are requested and the caller has access to tenant that the agent belongs to

        according to usual tenant accessibility rules, Agent Manager checks if settings stored specifically for

        this agent exist. If they do, they are returned. Otherwise, Agent Manager returns settings it would

        return in response to request for master settings of agent''s tenant, with the only difference being that

        if the master settings are found, they have agent identifier of the agent and do not have tenant

        identifier on output.


        If master settings of a tenant are requested, Agent Manager behaves differently depending on whether the

        caller has access to specified tenant according to usual tenant accessibility rules. If access is

        granted but tenant-specific settings are absent, Agent Manager searches for their substitute among

        tenants up tenant hierarchy along locator of specified tenant. This locator omits all tenants between

        the hierarchy root (as it is seen to Agent Manager) and a tenant with visibility barrier set nearest to

        specified tenant. This way the caller may retrieve master settings from a tenant beyond its usual

        access scope.


        If specified tenant is inaccessible to the caller, search for a substitute is not performed.

        Settings of the tenant are only returned to the caller if there is a tenant from caller''s access scope

        they would be returned for.


        If a substitute for master settings is found, it has tenant identifier of the specified tenant on output.'
      parameters:
      - name: master
        description: Boolean flag specifying whether master unattended agent update settings should be returned. If the value is true then `{id}` is interpreted as the ID of tenant the settings belong to. Otherwise, the `{id}` is interpreted as the agent ID.
        in: query
        schema:
          description: Boolean flag specifying whether master unattended agent update settings should be returned. If the value is true then `{id}` is interpreted as the ID of tenant the settings belong to. Otherwise, the `{id}` is interpreted as the agent ID.
          default: false
          type: boolean
      - name: id
        description: If query parameter is false or missing, this is a registered agent ID. Otherwise, this is a tenant ID.
        required: true
        in: path
        schema:
          description: If query parameter is false or missing, this is a registered agent ID. Otherwise, this is a tenant ID.
          type: string
      responses:
        '200':
          description: Unattended agent update settings were successfully retrieved.
          content:
            application/json:
              schema:
                description: Agent update settings.
                type: object
                required:
                - automatic
                - update_channel
                properties:
                  agent_id:
                    description: ID of a registered agent the settings belong to. This must only be present if tenant ID is absent.
                    example: 836fe933-d232-4ed1-b3be-2218f3bbf134
                    type: string
                  automatic:
                    description: Boolean flag specifying whether agent should be automatically updated to the latest version available in its update channel.
                    default: false
                    type: boolean
                  inherited_from_tenant_id:
                    description: If the update details were inherited from a parent tenant, this is the tenant ID. Otherwise, the value is absent.
                    example: '50'
                    type: string
                  maintenance_window:
                    description: Time intervals when agent update is allowed. If the window is not specified, this means that agent can be updated at any time. The window should be ignored if automatic update is disabled.
                    type: object
                    required:
                    - time_from
                    - days_of_week
                    - time_to
                    properties:
                      time_from:
                        description: Time of day when agent maintenance may start. It is agent local time.
                        example: 08:33:19
                        type: string
                        pattern: ^(?:[0-1][0-9]|2[0-3])(?::[0-5][0-9]){2}$
                        minLength: 8
                        maxLength: 8
                      days_of_week:
                        description: Days of week when agent maintenance may start (window's start time belongs to these days). They can be given in any order but duplicates are not allowed.
                        type: array
                        maxItems: 7
                        minItems: 1
                        uniqueItems: true
                        items:
                          $ref: '#/components/schemas/DayOfWeek'
                      time_to:
                        description: Time of day agent maintenance must complete before. It is agent local time. If this time is less than or equal to maintenance start time, this means the maintenance may proceed until this time next day.
                        example: 08:33:19
                        type: string
                        pattern: ^(?:[0-1][0-9]|2[0-3])(?::[0-5][0-9]){2}$
                        minLength: 8
                        maxLength: 8
                  update_channel:
                    $ref: '#/components/schemas/AgentUpdateChannel'
                  tenant_id:
                    description: ID of a tenant the settings belong to. This must only be present if agent ID is absent.
                    example: '62'
                    type: string
        '400':
          description: Request is malformed.
          content:
            application/json:
              schema:
