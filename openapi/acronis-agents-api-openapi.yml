openapi: 3.2.0
info:
  title: Acronis Agents API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  - x-last-validated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: acronis-agents-v2-openapi.json, acronis-agent-management-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev-cloud.acronis.com/api/agent_manager/v2
  variables: {}
- url: https://{datacenter}.acronis.com/api/agent_manager/v2
  description: Acronis Agent Management API
  variables:
    datacenter:
      default: eu2-cloud
      description: Acronis datacenter region
tags:
- name: Agents
paths:
  /agents:
    get:
      operationId: FetchAgents
      description: 'Fetches all registered agents seen from specified tenant.


        Result includes all agents registered in this tenant and in all its child tenants that don''t

        block parent access using visibility barrier.'
      parameters:
      - name: after
        description: 'Cursor that designates the last element of a previously returned registered agent subset

          (page). If this parameter is provided, the next agent page will be returned in the response

          (according to ordering requirements that were specified in the first request).

          This parameter is mutually exclusive with all other but limit query parameters.

          Client must treat it as opaque string.

          '
        in: query
        schema:
          description: 'Cursor that designates the last element of a previously returned registered agent subset

            (page). If this parameter is provided, the next agent page will be returned in the response

            (according to ordering requirements that were specified in the first request).

            This parameter is mutually exclusive with all other but limit query parameters.

            Client must treat it as opaque string.

            '
          example: aGVhbHRoY2hlY2s6C
          type: string
      - name: before
        description: 'Cursor that designates the first element of a previously returned registered agent subset

          (page). If this parameter is provided, the previous agent page will be returned in the response

          (according to ordering requirements that were specified in the first request).

          This parameter is mutually exclusive with all other but limit query parameters.

          Client must treat it as opaque string.

          '
        in: query
        schema:
          description: 'Cursor that designates the first element of a previously returned registered agent subset

            (page). If this parameter is provided, the previous agent page will be returned in the response

            (according to ordering requirements that were specified in the first request).

            This parameter is mutually exclusive with all other but limit query parameters.

            Client must treat it as opaque string.

            '
          example: aGVhbHRoY2hlY2s6C
          type: string
      - name: hostname
        description: 'Either a full name or a name segment (name mask) of a host where registered agent

          is installed. If this parameter is provided, only agents which host names match the parameter

          value are returned. Name mask is specified using one of match-like functions:

          - `hlike` - host name starts with specified string.

          - `like` - host name contains specified string in any position.

          - `tlike` - host name ends with specified string.

          '
        in: query
        schema:
          description: 'Either a full name or a name segment (name mask) of a host where registered agent

            is installed. If this parameter is provided, only agents which host names match the parameter

            value are returned. Name mask is specified using one of match-like functions:

            - `hlike` - host name starts with specified string.

            - `like` - host name contains specified string in any position.

            - `tlike` - host name ends with specified string.

            '
          example: hlike(server1)
          type: string
      - name: limit
        description: 'Maximum number of registered agents to return in the response. If this parameter is not provided or

          set to zero, there is no limit on number of returned agents.

          '
        in: query
        schema:
          description: 'Maximum number of registered agents to return in the response. If this parameter is not provided or

            set to zero, there is no limit on number of returned agents.

            '
          example: 100
          type: integer
      - name: online
        description: 'Flag that filters returned registered agents by their current responsiveness.

          If true, only responsive agents will be returned. If false, only irresponsive agents will be returned.

          '
        in: query
        schema:
          description: 'Flag that filters returned registered agents by their current responsiveness.

            If true, only responsive agents will be returned. If false, only irresponsive agents will be returned.

            '
          example: true
          type: boolean
      - name: order
        description: 'Ordering requirements on returned sequence of registered agents. They are specified as

          a comma-separated list of order specifications for agent attributes. Each attribute order

          specification is either asc (non-descending order) or desc (non-ascending order) function

          applied to an attribute name.

          Currently ordering by the following attributes is supported:

          - `hostname` - agents with same host names are further ordered in non-descending order by

          their agent identifiers

          '
        in: query
        schema:
          description: 'Ordering requirements on returned sequence of registered agents. They are specified as

            a comma-separated list of order specifications for agent attributes. Each attribute order

            specification is either asc (non-descending order) or desc (non-ascending order) function

            applied to an attribute name.

            Currently ordering by the following attributes is supported:

            - `hostname` - agents with same host names are further ordered in non-descending order by

            their agent identifiers

            '
          example: desc(hostname)
          type: string
      - name: os_family
        description: 'Parameter that filters registered agents by OS family name they were built for. OS family name is case-insensitive.

          '
        in: query
        schema:
          description: 'Parameter that filters registered agents by OS family name they were built for. OS family name is case-insensitive.

            '
          enum:
          - UNKNOWN
          - WINDOWS
          - LINUX
          - MACOSX
          - SOLARIS
          example: SOLARIS
          type: string
      - name: tenant_id
        description: 'Identifier of a tenant subtree root. Only agents that belong to tenants of this subtree

          are returned. If this parameter is missing, value from `X-Apigw-Tenant-Id` header is used.

          If this header is also missing, tenant identifiers from relevant elements of scope

          collection of access token are used.

          '
        in: query
        schema:
          description: 'Identifier of a tenant subtree root. Only agents that belong to tenants of this subtree

            are returned. If this parameter is missing, value from `X-Apigw-Tenant-Id` header is used.

            If this header is also missing, tenant identifiers from relevant elements of scope

            collection of access token are used.

            '
          example: '62'
          type: string
      - name: unit
        description: 'Name of registered agent unit. If this parameter is provided, only agents that have at

          least one of specified units are returned.

          '
        in: query
        schema:
          description: 'Name of registered agent unit. If this parameter is provided, only agents that have at

            least one of specified units are returned.

            '
          example: atp-agent
          type: string
      - name: up_to_date
        description: 'Flag specifying whether agents with current or outdated software should only be returned.

          '
        in: query
        schema:
          description: 'Flag specifying whether agents with current or outdated software should only be returned.

            '
          example: false
          type: boolean
      responses:
        '200':
          description: Collection of registered agents was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCollection'
        '400':
          description: Request is malformed.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - BAD_REQUEST
                    - BAD_UNATTENDED_AGENT_UPDATE_SETTINGS
                    - UNMARSHALLING_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '401':
          description: User authorization failed. There are many reasons for the error.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - UNAUTHORIZED_REQUEST
                    - AUTHENTICATION_TIMEOUT
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - GENERAL
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '403':
          description: Access was denied for roles a user plays in Platform.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - ACCESS_DENIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '500':
          description: Service encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - MARSHALLING_ERROR
                    - DATABASE_ERROR
                    - BAD_RESPONSE
                    - COMMUNICATION_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
      security:
      - oauth_2_0_user:
        - urn:acronis.com::agent_manager::agent_viewer
        - urn:acronis.com::agent_manager::admin
      tags:
      - Agents
      summary: Fetch agents
      x-summary-source: derived
    delete:
      operationId: DeleteAgents
      description: Cancels registration of the agents with Platform and deletes their service accounts.
      parameters:
      - name: id
        description: Identifier of agent to be deleted.
        required: true
        in: query
        schema:
          description: Identifier of agent to be deleted.
          example: 32b9375f-6400-4928-ae4f-5156e8aab21a
          type: string
      - name: force
        description: 'Flag specifying whether agent registration should be cancelled even if this is the

          last agent instance associated with a resource it manages. This flag is only respected

          for agents that have MMS unit. Other agents are deleted unconditionally.

          '
        in: query
        schema:
          description: 'Flag specifying whether agent registration should be cancelled even if this is the

            last agent instance associated with a resource it manages. This flag is only respected

            for agents that have MMS unit. Other agents are deleted unconditionally.

            '
          default: false
          example: true
          type: boolean
      responses:
        '204':
          description: Registration of specified agents with Platform was either successfully cancelled or didn't exist.
          content: {}
        '401':
          description: User authorization failed. There are many reasons for the error.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - UNAUTHORIZED_REQUEST
                    - AUTHENTICATION_TIMEOUT
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - GENERAL
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '403':
          description: Access was denied for roles a user plays in Platform.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - ACCESS_DENIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '409':
          description: Request violates some invariant.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - AGENT_UPDATE_NOT_SUSPENDED
                    - CLUSTER_ALREADY_EXISTS
                    - CLUSTER_IS_NOT_EMPTY
                    - HARDWARE_NODE_ALREADY_EXISTS
                    - HARDWARE_NODE_IS_OCCUPIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '500':
          description: Service encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - MARSHALLING_ERROR
                    - DATABASE_ERROR
                    - BAD_RESPONSE
                    - COMMUNICATION_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
      security:
      - oauth_2_0_user:
        - urn:acronis.com::agent_manager::agent_unregistrar
        - urn:acronis.com::agent_manager::admin
      tags:
      - Agents
      summary: Delete agents
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/agent_manager/v2
      variables: {}
  /agents/update:force:
    post:
      operationId: RunAgentUpdateNow
      description: 'Launches agent(s) update operation disregarding maintenance window settings, if any.

        Note that if an empty agent ID collection is passed with the request, all tenant''s agents

        become potential subject of update.


        Maximum number of agents being updated simultaneously is limited.'
      requestBody:
        content:
          application/json:
            schema:
              description: IDs of agents to update.
              type: object
              properties:
                agent_ids:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Agent(s) update request was accepted.
          content: {}
        '400':
          description: Request is malformed.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - BAD_REQUEST
                    - BAD_UNATTENDED_AGENT_UPDATE_SETTINGS
                    - UNMARSHALLING_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '401':
          description: User authorization failed. There are many reasons for the error.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - UNAUTHORIZED_REQUEST
                    - AUTHENTICATION_TIMEOUT
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - GENERAL
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '403':
          description: Access was denied for roles a user plays in Platform.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - ACCESS_DENIED
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
        '500':
          description: Service encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                description: REST error object.
                type: object
                required:
                - code
                - domain
                - debug
                properties:
                  code:
                    description: Domain-specific error code.
                    enum:
                    - MARSHALLING_ERROR
                    - DATABASE_ERROR
                    - BAD_RESPONSE
                    - COMMUNICATION_ERROR
                    type: string
                  domain:
                    description: Business domain the error belongs to.
                    enum:
                    - AGENT_MANAGER
                    type: string
                  debug:
                    description: Additional information about the error.
                    type: object
                    required:
                    - msg
                    properties:
                      msg:
                        description: Error description.
                        type: string
      security:
      - oauth_2_0_user:
        - urn:acronis.com::agent_manager::agent_registrar
        - urn:acronis.com::agent_manager::admin
      tags:
      - Agents
      summary: Run agent update now
      x-summary-source: derived
    servers:
    - url: https://dev-cloud.acronis.com/api/agent_manager/v2
      variables: {}
  /agents/{agent_id}:
    get:
      operationId: FetchAgent
      description: Fetches the specific agent.
      parameters:
      - name: agent_id
        description: The registered agent ID.
        required: true
        in: path
        schema:
          description: The registered agent ID.
          type: string
      responses:
        '200':
          description: Agent description was successfully retrieved.
          content:
            application/json:
              schema:
                description: Agent description.
                type: object
                required:
                - online
                - enabled
                - installer_version
                - meta
                - units
                - name
                - tenant
                - platform
                - registration_date
                - core_version
                - id
                - timezone
                - auto_update
                - registration_id
                - hostname
                properties:
                  online:
                    description: Flag designating if the agent is currently online.
                    type: boolean
                  network:
                    description: Agent host's network configuration.
                    type: object
                    required:
                    - network_interfaces
                    properties:
                      gateway:
                        description: IP address or host name of the gateway.
                        type: string
                      network_interfaces:
                        description: Network interfaces at agent's host.
                        type: array
                        minItems: 1
                        items:
                          $ref: '#/components/schemas/NetworkInterface'
                      dns_server_ip_addresses:
                        description: IP addresses of DNS servers. This collection may include addresses of both IPv4 and IPv6 servers.
                        type: array
                        items:
                          type: string
                  enabled:
                    description: Flag designating if the agent is currently enabled.
                    type: boolean
                  comment:
                    description: User-added comment on the agent.
                    type: string
                  installer_version:
                    description: Agent installer versions.
                    type: object
                    required:
                    - current
                    properties:
                      current:
                        description: The currently installed version.
                        type: object
                        required:
                        - minor
                        - build_number
                        - major
                        properties:
                          minor:
                            description: Minor version number.
                            type: integer
                            minimum: 0
                          build_number:
                            description: Build number.
                            type: integer
                            minimum: 0
                          major:
                            description: Major version number.
                            type: integer
                            minimum: 0
                      latest:
                        description: The latest available version. It is only present if the latest version is newer than the current one.
                        type: object
                        required:
                        - minor
                        - build_number
                        - major
                        properties:
                          minor:
                            description: Minor version number.
                            type: integer
                            minimum: 0
                          build_number:
                            description: Build number.
                            type: integer
                            minimum: 0
                          major:
                            description: Major version number.
                            type: integer
                            minimum: 0
                  unattended_update:
                    description: Details of unattended agent update. If the agent does not support unattended update, the value is absent.
                    type: object
                    required:
                    - automatic
                    - update_channel
                    - status
                    properties:
                      automatic:
                        description: Boolean flag specifying whether agent should be automatically updated to the latest version available in its update channel.
                        default: false
                        type: boolean
                      inherited_from_tenant_id:
                        description: If the update details were inherited from a parent tenant, this is the tenant ID. Otherwise, the value is absent.
                        example: '50'
                        type: string
                      maintenance_window:
                        description: Time intervals when agent update is allowed. If the window is not specified, this means that agent can be updated at any time. The window should be ignored if automatic update is disabled.
                        type: object
                        required:
                        - time_from
                        - days_of_week
                        - time_to
                        properties:
                          time_from:
                            description: Time of day when agent maintenance may start. It is agent local time.
                            example: 08:33:19
                            type: string
                            pattern: ^(?:[0-1][0-9]|2[0-3])(?::[0-5][0-9]){2}$
                            minLength: 8
                            maxLength: 8
                          days_of_week:
                            description: Days of week when agent maintenance may start (window's start time belongs to these days). They can be given in any order but duplicates are not allowed.
                            type: array
                            maxItems: 7
                            minItems: 1
                            uniqueItems: true
                            items:
                              $ref: '#/components/schemas/DayOfWeek'
                          time_to:
                            description: Time of day agent maintenance must complete before. It is agent local time. If this time is less than or equal to maintenance start time, this means the maintenance may proceed until this time next day.
                            example: 08:33:19
                            type: string
                            pattern: ^(?:[0-1][0-9]|2[0-3])(?::[0-5][0-9]){2}$
                            minLength: 8
                            maxLength: 8
                      update_channel:
                        $ref: '#/components/schemas/AgentUpdateChannel'
                      status:
                        description: Current status of unattended update of particular agent.
                        enum:
                        - OK
                        - SUSPENDED_ON_FAILURES
                        type: string
                  meta:
                    description: The agent metadata.
                    type: object
                  units:
                    description: Components the agent consists of. This can be an empty list if the agent has only Agent Core component installed.
                    type: array
                    items:
                      $ref: '#/components/schemas/SoftwareUnit'
                  name:
                    description: Agent name as seen by a user.
                    example: My Appliance 6490-78
                    type: string
                  tenant:
                    description: Tenant descriptor of the agent owner.
                    type: object
                    required:
                    - id
                    - name
                    properties:
                      id:
                        description: The tenant identifier.
                        type: string
                      name:
                        description: The tenant name.
                        type: string
                  platform:
                    description: Descriptor of operating system the agent is running on.
                    type: object
                    required:
                    - name
                    - version_minor
                    - family
                    - arch
                    - version_major
                    properties:
                      service_pack:
                        description: OS service pack number if applicable.
                        type: integer
                        format: int32
                      name:
                        description: Full Operating System name.
                        type: string
                      version_minor:
                        description: OS minor version number.
                        type: integer
                        format: int32
                      sku:
                        description: OS stock keeping unit ID.
                        type: integer
                        format: int32
                      product_type:
                        description: OS product type if applicable.
                        type: integer
                        format: int32
                      family:
                        description: Operating System family.
                        enum:
                        - UNKNOWN
                        - WINDOWS
                        - LINUX
                        - MACOSX
                        - SOLARIS
                        type: string
                      arch:
                        description: Operating System target hardware architecture.
                        enum:
                        - X86
                        - X64
                        - ARM
                        - ARM64
                        type: string
                      version_major:
                        description: OS major version number.
                        type: integer
                        format: int32
                      caps:
                        description: OS capability mask if applicable.
                        type: integer
                        format: int32
                      suite_mask:
                        description: OS suite mask if applicable.
                        type: integer
                        format: int32
                  registration_date:
                    description: Agent registration date in RFC 1123 format with numeric time zone.
                    example: Tue, 04 Jun 2019 18:32:26 +0300
                    type: string
                  core_version:
                    description: Agent Core version.
                    type: object
                    required:
                    - current
                    properties:
                      current:
                        description: The currently installed version.
                        type: object
                        required:
                        - build
                        - release_id
                        properties:
                          build:
                            description: Build number.
                            example: '42'
                            type: string
                          release_id:
                            description: Release identifier.
                            example: 1.0.0
                            type: string
                          release_name:
                            description: Human-readable release name.
                            type: string
                      latest:
                        description: The latest available version. It is only present if the latest version is newer than the current one.
                        type: object
                        required:
                        - build
                        - release_id
                        properties:
                          build:
                            description: Build number.
                            example: '42'
                            type: string
                          release_id:
                            description: Release identifier.
                            example: 1.0.0
                            type: string
                          release_name:
