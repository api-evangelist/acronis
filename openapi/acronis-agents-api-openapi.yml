components:
  schemas:
    AgentUpdateChannel:
      description: Source of new agent versions.
      enum:
      - CURRENT
      - STABLE
      type: string
    DayOfWeek:
      description: Day of week specifier.
      enum:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
      type: string
    AgentCollection:
      description: Collection of registered agents.
      example:
        items:
        - id: 8f27a66f-71ff-4b5c-b665-75ec0f42b849
          core_version:
            current:
              release_id: 1.0.0
              build: '42'
          units:
          - name: atp
            version:
              current:
                release_id: 1.0.0
                build: '42'
              latest:
                release_id: 1.0.1
                build: '57'
          - name: backup
            version:
              current:
                release_id: 1.0.0
                build: '42'
          auto_update: true
          meta: {}
          hostname: server1.acme.local
          platform:
            family: WINDOWS
            arch: X64
            name: Windows 2019
            version_major: 10
            version_minor: 0
          tenant:
            id: '64'
            name: ACME
          name: My Appliance 6490-78
          online: true
          enabled: true
          registration_date: Tue, 04 Jun 2019 18:32:26 +0300
          registration_id: eO2uM8QwSIC3nh0FxiZmjArpW-U
          installer_version:
            current:
              major: 15
              minor: 0
              build_number: 27714
          timezone: '+0300'
        paging:
          cursors:
            after: aGVhbHRoY2hlY2s6C
            before: CiAgdGltZW91dDogMTBzCi
      type: object
      required:
      - items
      - paging
      properties:
        items:
          description: Collection of registered agents.
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        paging:
          description: 'Position descriptor of returned collection in entire sequence of agents that satisfy the

            same filter and ordering requirements as returned agents do.

            '
          type: object
          required:
          - cursors
          properties:
            cursors:
              description: ''
              type: object
              properties:
                after:
                  description: 'Opaque string that designates the last element of a resource page. If this parameter is

                    missing this means that the page is the last one in associated resource sequence.

                    '
                  example: aGVhbHRoY2hlY2s6C
                  type: string
                before:
                  description: 'Opaque string that designates the first element of a resource page. If this parameter is

                    missing this means that the page is the first one in associated resource sequence.

                    '
                  example: aGVhbHRoY2hlY2s6C
                  type: string
    Agent:
      description: An agent registered with Platform.
      example:
        id: 8f27a66f-71ff-4b5c-b665-75ec0f42b849
        core_version:
          current:
            release_id: 1.0.0
            build: '42'
        units:
        - name: atp
          version:
            current:
              release_id: 1.0.0
              build: '42'
            latest:
              release_id: 1.0.1
              build: '57'
        - name: backup
          version:
            current:
              release_id: 1.0.0
              build: '42'
        auto_update: true
        unattended_update:
          inherited_from_tenant_id: '50'
          update_channel: CURRENT
          automatic: true
          maintenance_window:
            time_from: '22:15:00'
            time_to: 05:00:00
            days_of_week:
            - MONDAY
            - WEDNESDAY
            - SATURDAY
          status: OK
        meta: {}
        hostname: server1.acme.local
        platform:
          family: WINDOWS
          arch: X64
          name: Windows 2019
          version_major: 10
          version_minor: 0
        tenant:
          id: '64'
          name: ACME
        name: My Appliance 6490-78
        online: true
        enabled: true
        registration_date: Tue, 04 Jun 2019 18:32:26 -0700
        registration_id: eO2uM8QwSIC3nh0FxiZmjArpW-U
        network:
          network_interfaces:
          - cidr_notations:
            - 10.110.64.0/27
            mac_address: 44-AF-28-1E-54-8C
          gateway: 10.110.64.1
          dns_server_ip_addresses:
          - 10.110.64.2
        installer_version:
          current:
            major: 15
            minor: 0
            build_number: 26822
          latest:
            major: 15
            minor: 0
            build_number: 27714
        timezone: '-0700'
      type: object
      required:
      - online
      - enabled
      - installer_version
      - meta
      - units
      - name
      - tenant
      - platform
      - registration_date
      - core_version
      - id
      - timezone
      - auto_update
      - hostname
      - registration_id
      properties:
        online:
          description: Flag designating if the agent is currently online.
          type: boolean
        network:
          description: Agent host's network configuration.
          type: object
          required:
          - network_interfaces
          properties:
            gateway:
              description: IP address or host name of the gateway.
              type: string
            network_interfaces:
              description: Network interfaces at agent's host.
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/NetworkInterface'
            dns_server_ip_addresses:
              description: IP addresses of DNS servers. This collection may include addresses of both IPv4 and IPv6 servers.
              type: array
              items:
                type: string
        enabled:
          description: Flag designating if the agent is currently enabled.
          type: boolean
        comment:
          description: User-added comment on the agent.
          type: string
        installer_version:
          description: Agent installer versions.
          type: object
          required:
          - current
          properties:
            current:
              description: The currently installed version.
              type: object
              required:
              - minor
              - build_number
              - major
              properties:
                minor:
                  description: Minor version number.
                  type: integer
                  minimum: 0
                build_number:
                  description: Build number.
                  type: integer
                  minimum: 0
                major:
                  description: Major version number.
                  type: integer
                  minimum: 0
            latest:
              description: The latest available version. It is only present if the latest version is newer than the current one.
              type: object
              required:
              - minor
              - build_number
              - major
              properties:
                minor:
                  description: Minor version number.
                  type: integer
                  minimum: 0
                build_number:
                  description: Build number.
                  type: integer
                  minimum: 0
                major:
                  description: Major version number.
                  type: integer
                  minimum: 0
        unattended_update:
          description: Details of unattended agent update. If the agent does not support unattended update, the value is absent.
          type: object
          required:
          - automatic
          - update_channel
          - status
          properties:
            automatic:
              description: Boolean flag specifying whether agent should be automatically updated to the latest version available in its update channel.
              default: false
              type: boolean
            inherited_from_tenant_id:
              description: If the update details were inherited from a parent tenant, this is the tenant ID. Otherwise, the value is absent.
              example: '50'
              type: string
            maintenance_window:
              description: Time intervals when agent update is allowed. If the window is not specified, this means that agent can be updated at any time. The window should be ignored if automatic update is disabled.
              type: object
              required:
              - time_from
              - days_of_week
              - time_to
              properties:
                time_from:
                  description: Time of day when agent maintenance may start. It is agent local time.
                  example: 08:33:19
                  type: string
                  pattern: ^(?:[0-1][0-9]|2[0-3])(?::[0-5][0-9]){2}$
                  minLength: 8
                  maxLength: 8
                days_of_week:
                  description: Days of week when agent maintenance may start (window's start time belongs to these days). They can be given in any order but duplicates are not allowed.
                  type: array
                  maxItems: 7
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/DayOfWeek'
                time_to:
                  description: Time of day agent maintenance must complete before. It is agent local time. If this time is less than or equal to maintenance start time, this means the maintenance may proceed until this time next day.
                  example: 08:33:19
                  type: string
                  pattern: ^(?:[0-1][0-9]|2[0-3])(?::[0-5][0-9]){2}$
                  minLength: 8
                  maxLength: 8
            update_channel:
              $ref: '#/components/schemas/AgentUpdateChannel'
            status:
              description: Current status of unattended update of particular agent.
              enum:
              - OK
              - SUSPENDED_ON_FAILURES
              type: string
        meta:
          description: The agent metadata.
          type: object
        units:
          description: Components the agent consists of. This can be an empty list if the agent has only Agent Core component installed.
          type: array
          items:
            $ref: '#/components/schemas/SoftwareUnit'
        name:
          description: Agent name as seen by a user.
          example: My Appliance 6490-78
          type: string
        tenant:
          description: Tenant descriptor of the agent owner.
          type: object
          required:
          - id
          - name
          properties:
            id:
              description: The tenant identifier.
              type: string
            name:
              description: The tenant name.
              type: string
        platform:
          description: Descriptor of operating system the agent is running on.
          type: object
          required:
          - name
          - version_minor
          - family
          - arch
          - version_major
          properties:
            service_pack:
              description: OS service pack number if applicable.
              type: integer
              format: int32
            name:
              description: Full Operating System name.
              type: string
            version_minor:
              description: OS minor version number.
              type: integer
              format: int32
            sku:
              description: OS stock keeping unit ID.
              type: integer
              format: int32
            product_type:
              description: OS product type if applicable.
              type: integer
              format: int32
            family:
              description: Operating System family.
              enum:
              - UNKNOWN
              - WINDOWS
              - LINUX
              - MACOSX
              - SOLARIS
              type: string
            arch:
              description: Operating System target hardware architecture.
              enum:
              - X86
              - X64
              - ARM
              - ARM64
              type: string
            version_major:
              description: OS major version number.
              type: integer
              format: int32
            caps:
              description: OS capability mask if applicable.
              type: integer
              format: int32
            suite_mask:
              description: OS suite mask if applicable.
              type: integer
              format: int32
        registration_date:
          description: Agent registration date in RFC 1123 format with numeric time zone.
          example: Tue, 04 Jun 2019 18:32:26 +0300
          type: string
        core_version:
          description: Agent Core version.
          type: object
          required:
          - current
          properties:
            current:
              description: The currently installed version.
              type: object
              required:
              - build
              - release_id
              properties:
                build:
                  description: Build number.
                  example: '42'
                  type: string
                release_id:
                  description: Release identifier.
                  example: 1.0.0
                  type: string
                release_name:
                  description: Human-readable release name.
                  type: string
            latest:
              description: The latest available version. It is only present if the latest version is newer than the current one.
              type: object
              required:
              - build
              - release_id
              properties:
                build:
                  description: Build number.
                  example: '42'
                  type: string
                release_id:
                  description: Release identifier.
                  example: 1.0.0
                  type: string
                release_name:
                  description: Human-readable release name.
                  type: string
        id:
          description: Unique agent ID. This must be valid string representation of a UUID. The ID is used for client ID construction of the agent service account.
          example: 3953e625-d0a2-420c-86a6-afb9d91aca3e
          type: string
        timezone:
          $ref: '#/components/schemas/TimeZoneOffset'
        distribution_type:
          description: Software distribution type.
          example: SPLA_INFRASTRUCTURE
          type: string
        auto_update:
          description: 'Flag specifying whether the agent is configured to update in automatic unattended mode.

            Deprecated. Use ''unattended_update'' property instead: if it is absent, the agent cannot

            update automatically; otherwise, check value of ''unattended_update.automatic'' property.

            '
          type: boolean
        hostname:
          description: Host name.
          example: server1.acme.local
          type: string
        registration_id:
          description: Agent registration ID.
          example: eO2uM8QwSIC3nh0FxiZmjArpW-U
          type: string
    SoftwareUnit:
      description: Unit name. This must be specified in Agent Manager configuration and there must be corresponding client role in Backup Account Server configuration.
      type: object
      required:
      - name
      - version
      properties:
        name:
          description: Unit name.
          type: string
        version:
          description: Unit version.
          type: object
          required:
          - current
          properties:
            current:
              description: The currently installed version.
              type: object
              required:
              - build
              - release_id
              properties:
                build:
                  description: Build number.
                  example: '42'
                  type: string
                release_id:
                  description: Release identifier.
                  example: 1.0.0
                  type: string
                release_name:
                  description: Human-readable release name.
                  type: string
            latest:
              description: The latest available version. It is only present if the latest version is newer than the current one.
              type: object
              required:
              - build
              - release_id
              properties:
                build:
                  description: Build number.
                  example: '42'
                  type: string
                release_id:
                  description: Release identifier.
                  example: 1.0.0
                  type: string
                release_name:
                  description: Human-readable release name.
                  type: string
    NetworkInterface:
      description: A network interface of a host.
      example:
        cidr_notations:
        - 10.110.64.0/27
        - 2a00:1370:8127:c109:0812:d5c0:1800:0000/102
        mac_address: 44-AF-28-1E-54-8C
      type: object
      required:
      - cidr_notations
      properties:
        cidr_notations:
          description: Network IP addresses and their associated network masks in CIDR notation. This collection may include items for both IPv4 and IPv6 protocol versions.
          type: array
          minItems: 1
          items:
            type: string
        mac_address:
          description: MAC address of the network interface.
          type: string
    TimeZoneOffset:
      description: "Agent's time zone offset from UTC time zone in SHHMM format, where:\n  \n  - S is either '+' or '-'\n  - HH is number of hours [00,23]\n  - MM is number of minutes [00,59]\n\nFor zero offset, 'UTC' string can be used.\n"
      example: '+0300'
      type: string
      pattern: ^UTC|(?:\+|-)(?:[0-1][0-9]|2[0-3])[0-5][0-9]$
    AgentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent_2'
        paging:
          type: object
          properties:
            cursors:
              type: object
    AgentOS:
      type: object
      description: Operating system information for an agent
      properties:
        family:
          type: string
          enum:
          - WINDOWS
          - LINUX
          - MACOSX
          - SOLARIS
          example: WINDOWS
        arch:
          type: string
          enum:
          - X86
          - X64
          - ARM
          - ARM64
          example: X64
        name:
          type: string
          example: Windows 11 Pro
        version:
          type: string
          example: 10.0.22621
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    Agent_2:
      type: object
      description: Acronis protection agent registered on an endpoint
      properties:
        id:
          type: string
          description: Agent unique identifier
          example: agent-uuid-001
        hostname:
          type: string
          description: Hostname of the protected machine
          example: workstation-01
        status:
          type: string
          enum:
          - online
          - offline
          - unknown
          description: Current agent connection status
          example: online
        version:
          type: string
          description: Agent software version
          example: 21.12.30
        tenant_id:
          type: string
          format: uuid
          description: Tenant this agent belongs to
        os:
          $ref: '#/components/schemas/AgentOS'
        last_seen:
          type: string
          format: date-time
          description: Last time agent communicated with the platform
        registration_time:
          type: string
          format: date-time
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
