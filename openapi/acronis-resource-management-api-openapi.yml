    Resource:
      description: 'An object, which status is interesting or important to track for some reason for

        end customer. Typically originates from an external (customer-owned) system or in any other

        way owned by customer. Identifiable and having a granularity enough to be easy to track

        to the customer. Actions executed on this object, that change status important to customer,

        can be configured either per resource or via policies. In the latter case, multiple policies

        (i.e., multiple rules / settings sets) may be configured for the resource simultaneously.


        Resources can be simple (''atomic'') or composite (''groups'') or / and linked with other

        resources, but no separate type for resource compositions is defined, as a consequence,

        simple and composite resources share the same identifiers space.


        From policies perspective, resources serve as contexts to which policy rules / settings are

        applied and executed.

        '
      type: object
      required:
      - name
      - parent_group_ids
      - cti
      - type
      properties:
        is_auto_created:
          description: Automatic creation happens in workload merge and cluster-like use case, when `aggregates_detection_query` is defined per-workload type. Otherwise, workload is explicitly created - at the time of metadata provisioning or at runtime by a vendor agent or connector, or at runtime by a cusomter.
          type: boolean
        group_condition:
          description: Per-workload children selection query, if the workload is a dynamic group.
          type: string
        _issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue_1'
        agent_id:
          type: string
        external_id:
          description: ID from original external system.
          type: string
        created_at:
          type: string
          format: date-time
        aspects:
          description: Calculatable field, representing all aspects of the aggregate (i.e. all aspect workloads with same `aggregate_id` value).
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        name:
          type: string
        allowed_member_types:
          type: array
          items:
            $ref: '#/components/schemas/ResourceType'
        updated_at:
          type: string
          format: date-time
        id:
          $ref: '#/components/schemas/InternalID'
        aggregation_status:
          description: Aggregation / split status.
          enum:
          - NOT_AGGREGATED
          - MERGED_AUTOMATICALLY
          - MERGED_MANUALLY
          - SPLIT_MANUALLY
          type: string
        user_defined_name:
          type: string
        attributes:
          description: Available base namespaces listed in the `ResourceAttributeNamespace` type definition.
          type: array
          items:
            $ref: '#/components/schemas/NamedKeyValueSet'
        client_id:
          description: client ID of an agent or other subject, that manages and accesses the aspect. In case when a workload is managed by multiple agents, there should be multiple workload aspect instances, each aspect instance referencing different client ID of a corresponding agent, of same or different agent type.
          type: string
        tag:
          description: Any user-defined string value, the resources can further be filtered by it
          type: string
        parent_group_ids:
          type: array
          items:
            $ref: '#/components/schemas/InternalID_2'
